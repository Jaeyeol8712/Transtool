<label for="hrA">나이 (만 나이)</label>
<input id="hrA" type="number" inputmode="numeric" placeholder="40"/>
<label for="hrM">최대 심박수를 잰 값이 있으면 (bpm, 선택)</label>
<input id="hrM" type="number" inputmode="numeric" placeholder="비우면 220 − 나이"/>
<button onclick="calcHr()">심박수 구간 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">최대 심박수 (추정)</span><span class="result-value" id="hrMax">-</span></div>
<div class="result-row"><span class="result-label">중강도 (50~70%)</span><span class="result-value" id="hrMod" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">고강도 (70~85%)</span><span class="result-value" id="hrVig" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function hrCalc(age,mx){var M=mx>0?mx:220-age;return {max:M,mod:[Math.round(M*.5),Math.round(M*.7)],vig:[Math.round(M*.7),Math.round(M*.85)]};}
function calcHr(){
 var a=parseFloat(document.getElementById('hrA').value),m=parseFloat(document.getElementById('hrM').value);
 if(!(m>0)&&(isNaN(a)||a<=0||a>=120)) return alert('나이를 입력해주세요.');
 var o=hrCalc(a,m);
 document.getElementById('hrMax').textContent=o.max+'bpm';
 document.getElementById('hrMod').textContent='분당 '+o.mod[0]+'~'+o.mod[1]+'회';
 document.getElementById('hrVig').textContent='분당 '+o.vig[0]+'~'+o.vig[1]+'회';
 document.getElementById('result').classList.add('show');
}
</script>
