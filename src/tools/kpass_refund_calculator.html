<label for="kp1">한 달 대중교통비 (원)</label>
<input id="kp1" type="number" inputmode="numeric" placeholder="90000"/>
<label for="kp2">한 달 이용 횟수 (통행)</label>
<input id="kp2" type="number" inputmode="numeric" placeholder="44"/>
<label for="kp3">대상</label>
<select id="kp3"><option value="0.2" selected>일반 (만 35~64세) 20%</option><option value="0.3">청년·어르신·2자녀 30%</option><option value="0.5">3자녀 50%</option><option value="0.533">저소득 53.3%</option></select>
<label for="kp4">모두의 카드 기준 금액 (일반형·평시, 수도권)</label>
<select id="kp4"><option value="62000" selected>일반 6만 2천 원</option><option value="55000">청년·어르신·2자녀 5만 5천 원</option><option value="45000">3자녀·저소득 4만 5천 원</option><option value="0">비교 안 함</option></select>
<button onclick="calc_kpass_refund()">환급액 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">예상 환급액 (큰 쪽)</span><span class="result-value" id="kpM">-</span></div>
<div class="result-row"><span class="result-label">기본형 환급</span><span class="result-value" id="kpB" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">정액형(일반형) 환급</span><span class="result-value" id="kpF" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">조건</span><span class="result-value" id="kpN" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_kpass_refund(){
 var c=_v('kp1'),n=_v('kp2'),r=parseFloat(document.getElementById('kp3').value),th=parseFloat(document.getElementById('kp4').value);
 if(isNaN(c)||c<=0||isNaN(n)||n<0) return alert('교통비와 이용 횟수를 입력해주세요.');
 var ok=n>=15, b=ok?c*r:0, f=(ok&&th>0)?Math.max(0,c-th):0;
 _s('kpM',_w(Math.max(b,f))); _s('kpB',_w(b)); _s('kpF',th>0?_w(f):'-'); _s('kpN',ok?'월 15회 이상 충족':'월 15회 미만이라 환급 없음 (첫 달 제외)');
 document.getElementById('result').classList.add('show');
}
</script>
