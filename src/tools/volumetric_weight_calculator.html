<label for="vw1">가로 (cm)</label>
<input id="vw1" type="number" inputmode="decimal" placeholder="50"/>
<label for="vw2">세로 (cm)</label>
<input id="vw2" type="number" inputmode="decimal" placeholder="40"/>
<label for="vw3">높이 (cm)</label>
<input id="vw3" type="number" inputmode="decimal" placeholder="30"/>
<label for="vw4">실제 무게 (kg)</label>
<input id="vw4" type="number" inputmode="decimal" placeholder="5"/>
<label for="vw5">나누는 값 (운송사 기준)</label>
<select id="vw5"><option value="6000" selected>6000 (국제 특송 다수)</option><option value="5000">5000</option></select>
<button onclick="calc_volumetric_weight()">부피무게 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">청구 기준 무게</span><span class="result-value" id="vwC">-</span></div>
<div class="result-row"><span class="result-label">부피무게</span><span class="result-value" id="vwV" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">실제 무게</span><span class="result-value" id="vwA" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_volumetric_weight(){
 var a=_v('vw1'),b=_v('vw2'),c=_v('vw3'),w=_v('vw4'),d=parseFloat(document.getElementById('vw5').value);
 if([a,b,c].some(function(x){return isNaN(x)||x<=0;})) return alert('가로·세로·높이를 입력해주세요.'); if(isNaN(w))w=0;
 var v=a*b*c/d;
 _s('vwC',_n(Math.max(v,w),2)+'kg'+(v>w?' (부피무게)':' (실제 무게)')); _s('vwV',_n(v,2)+'kg'); _s('vwA',_n(w,2)+'kg');
 document.getElementById('result').classList.add('show');
}
</script>
