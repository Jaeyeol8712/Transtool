<label for="compPrincipal">초기 원금 (원)</label>
<input id="compPrincipal" placeholder="예: 10000000" type="number"/>
<label for="compRate">연 수익률 (%)</label>
<input id="compRate" placeholder="예: 7" type="number"/>
<label for="compYears">투자 기간 (년)</label>
<input id="compYears" placeholder="예: 10" type="number"/>
<button onclick="calcCompound()">복리 수익 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">순수익 (이자)</span><span class="result-value" id="compInterest" style="color:var(--text); font-size:1.1rem;">-</span></div>
<div class="result-row"><span class="result-label">최종 자산 합계</span><span class="result-value" id="compTotal">-</span></div>
</div>
<script>
function calcCompound(){
 const p = parseFloat(document.getElementById('compPrincipal').value);
 const r = parseFloat(document.getElementById('compRate').value) / 100;
 const t = parseInt(document.getElementById('compYears').value);
 if(!p || !r || !t) return alert('모두 입력해주세요.');
 const total = p * Math.pow((1 + r), t);
 const interest = total - p;
 document.getElementById('compInterest').textContent = Math.round(interest).toLocaleString() + '원';
 document.getElementById('compTotal').textContent = Math.round(total).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
}
</script>
