<label for="fuelDist">이동 거리 (km)</label>
<input id="fuelDist" placeholder="예: 350" type="number"/>
<label for="fuelEff">차량 공인 연비 (km/L)</label>
<input id="fuelEff" placeholder="예: 13.5" type="number"/>
<label for="fuelPrice">리터당 연료 가격 (원/L)</label>
<input id="fuelPrice" placeholder="예: 1650" type="number"/>
<button onclick="calcFuel()">유류비 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">소모 예상 연료량</span><span class="result-value" id="fuelLiter" style="font-size:1.1rem; color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">예상 주유 비용</span><span class="result-value" id="fuelCost">-</span></div>
</div>
<script>
 function calcFuel(){
 const d = parseFloat(document.getElementById('fuelDist').value);
 const e = parseFloat(document.getElementById('fuelEff').value);
 const p = parseFloat(document.getElementById('fuelPrice').value);
 if(!d || !e || !p) return alert('모두 입력해주세요.');
 const liter = d / e;
 const cost = liter * p;
 document.getElementById('fuelLiter').textContent = liter.toFixed(2) + ' 리터';
 document.getElementById('fuelCost').textContent = Math.round(cost).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
 }
 </script>
