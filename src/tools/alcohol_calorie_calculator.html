<p style="margin:0 0 .6rem;line-height:1.6">마신 양을 넣으세요. 용량·도수는 흔한 제품 예시이며 제품마다 다릅니다.</p>
<label for="alSoju">소주 (1병 360ml · 16.5%, 병)</label><input id="alSoju" type="number" inputmode="decimal" placeholder="1"/>
<label for="alBeer">맥주 (500ml · 4.5%, 잔)</label><input id="alBeer" type="number" inputmode="decimal" placeholder="2"/>
<label for="alMak">막걸리 (1병 750ml · 6%, 병)</label><input id="alMak" type="number" inputmode="decimal" placeholder="0"/>
<label for="alWine">와인 (1잔 150ml · 12%, 잔)</label><input id="alWine" type="number" inputmode="decimal" placeholder="0"/>
<label for="alWhisky">위스키 (1잔 30ml · 40%, 잔)</label><input id="alWhisky" type="number" inputmode="decimal" placeholder="0"/>
<button onclick="calcAl()">열량 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">마신 순수 알코올</span><span class="result-value" id="alG" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">알코올 열량</span><span class="result-value" id="alK">-</span></div>
<p id="alMsg" style="margin:.6rem 0 0;line-height:1.6"></p>
</div>
<script>
function calcAl(){
 var d=[['alSoju',360,.165],['alBeer',500,.045],['alMak',750,.06],['alWine',150,.12],['alWhisky',30,.40]],g=0;
 d.forEach(function(x){g+=(parseFloat(document.getElementById(x[0]).value)||0)*x[1]*x[2]*.789;});
 if(!(g>0)) return alert('마신 양을 입력해주세요.');
 document.getElementById('alG').textContent=Math.round(g)+'g';
 document.getElementById('alK').textContent=Math.round(g*7).toLocaleString('ko-KR')+'kcal';
 document.getElementById('alMsg').textContent='알코올만 계산한 값입니다(1g당 7kcal). 맥주·막걸리·칵테일은 당분 열량이 더해져 실제로는 더 높습니다. 술을 마셨다면 운전하지 마세요.';
 document.getElementById('result').classList.add('show');
}
</script>
