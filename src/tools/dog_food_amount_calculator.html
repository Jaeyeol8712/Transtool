<label for="df1">반려견 몸무게 (kg)</label>
<input id="df1" type="number" inputmode="decimal" placeholder="5"/>
<label for="df2">상태</label>
<select id="df2"><option value="3">4개월 미만 강아지</option><option value="2">4개월~1살 강아지</option><option value="1.6" selected>중성화한 성견</option><option value="1.8">중성화 안 한 성견</option><option value="1.4">노령견·살찌기 쉬운 성견</option><option value="1.0">체중 감량 중</option></select>
<label for="df3">사료 열량 (kcal/kg, 포장 표기)</label>
<input id="df3" type="number" inputmode="numeric" placeholder="3600"/>
<button onclick="calc_dog_food_amount()">하루 급여량 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">하루 사료량</span><span class="result-value" id="dfG">-</span></div>
<div class="result-row"><span class="result-label">하루 필요 열량</span><span class="result-value" id="dfK" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">휴식 에너지(RER)</span><span class="result-value" id="dfR" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_dog_food_amount(){
 var w=_v('df1'),f=parseFloat(document.getElementById('df2').value),k=_v('df3');
 if(isNaN(w)||w<=0||isNaN(k)||k<=0) return alert('몸무게와 사료 열량을 입력해주세요.');
 var rer=70*Math.pow(w,0.75), der=rer*f;
 _s('dfG',_n(der/k*1000,0)+'g'); _s('dfK',_n(der,0)+'kcal'); _s('dfR',_n(rer,0)+'kcal');
 document.getElementById('result').classList.add('show');
}
</script>
