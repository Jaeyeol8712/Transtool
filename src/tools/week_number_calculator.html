<label for="wnDate">날짜</label>
<input id="wnDate" type="date"/>
<button onclick="calcWn()">주차 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">ISO 주차</span><span class="result-value" id="wnIso">-</span></div>
<div class="result-row"><span class="result-label">이번 달 몇 주차</span><span class="result-value" id="wnMon" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">올해 지난 날 · 남은 날</span><span class="result-value" id="wnLeft" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
document.getElementById('wnDate').valueAsDate=new Date();
function calcWn(){
 var v=document.getElementById('wnDate').value; if(!v) return alert('날짜를 입력해주세요.');
 var p=v.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
 var t=new Date(d.getTime()); var dow=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dow+3);
 var fy=t.getUTCFullYear(), ft=new Date(Date.UTC(fy,0,4)); var fdow=(ft.getUTCDay()+6)%7; ft.setUTCDate(ft.getUTCDate()-fdow+3);
 var wk=1+Math.round((t-ft)/6048e5);
 var first=new Date(Date.UTC(+p[0],+p[1]-1,1)), fd=(first.getUTCDay()+6)%7, mw=Math.floor((+p[2]+fd-1)/7)+1;
 var y0=Date.UTC(+p[0],0,1), y1=Date.UTC(+p[0]+1,0,1), passed=Math.round((d-y0)/864e5)+1, total=Math.round((y1-y0)/864e5);
 document.getElementById('wnIso').textContent=fy+'년 '+wk+'주차';
 document.getElementById('wnMon').textContent=(+p[1])+'월 '+mw+'주차 (월요일 시작)';
 document.getElementById('wnLeft').textContent=passed+'일째 · '+(total-passed)+'일 남음 ('+Math.round(passed/total*1000)/10+'%)';
 document.getElementById('result').classList.add('show');
}
</script>
