<label for="up1">상품 A 가격 (원)</label>
<input id="up1" type="number" inputmode="numeric" placeholder="4980"/>
<label for="up2">상품 A 용량 (g·ml)</label>
<input id="up2" type="number" inputmode="decimal" placeholder="500"/>
<label for="up3">상품 B 가격 (원)</label>
<input id="up3" type="number" inputmode="numeric" placeholder="8900"/>
<label for="up4">상품 B 용량 (g·ml)</label>
<input id="up4" type="number" inputmode="decimal" placeholder="1000"/>
<label for="up5">비교 단위</label>
<select id="up5"><option value="100" selected>100g·100ml당</option><option value="1">1g·1ml당</option><option value="1000">1kg·1L당</option></select>
<button onclick="calc_unit_price_compare()">단위 가격 비교</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">더 싼 쪽</span><span class="result-value" id="upW">-</span></div>
<div class="result-row"><span class="result-label">상품 A 단위 가격</span><span class="result-value" id="upA" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">상품 B 단위 가격</span><span class="result-value" id="upB" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">차이</span><span class="result-value" id="upD" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_unit_price_compare(){
 var pa=_v('up1'),qa=_v('up2'),pb=_v('up3'),qb=_v('up4'),u=parseFloat(document.getElementById('up5').value);
 if([pa,qa,pb,qb].some(function(x){return isNaN(x)||x<=0;})) return alert('두 상품의 가격과 용량을 입력해주세요.');
 var a=pa/qa*u,b=pb/qb*u;
 _s('upW',a<b?'상품 A':(b<a?'상품 B':'같음')); _s('upA',_n(a,1)+'원'); _s('upB',_n(b,1)+'원'); _s('upD',_n(Math.abs(a-b)/Math.max(a,b)*100)+'% 저렴');
 document.getElementById('result').classList.add('show');
}
</script>
