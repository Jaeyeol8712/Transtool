<p style="margin:.2rem 0 .6rem;font-size:.92rem">최근 180일 안의 솅겐 체류를 입국일·출국일로 넣으세요. 입국일과 출국일 모두 하루로 셉니다. 빈 칸은 건너뜁니다.</p>
<label for="sg1a">여행 1 입국일</label><input id="sg1a" type="date"/>
<label for="sg1b">여행 1 출국일</label><input id="sg1b" type="date"/>
<label for="sg2a">여행 2 입국일</label><input id="sg2a" type="date"/>
<label for="sg2b">여행 2 출국일</label><input id="sg2b" type="date"/>
<label for="sg3a">여행 3 입국일</label><input id="sg3a" type="date"/>
<label for="sg3b">여행 3 출국일</label><input id="sg3b" type="date"/>
<label for="sg9">다음 입국 예정일 (기준일)</label>
<input id="sg9" type="date"/>
<button onclick="calc_schengen_90_180()">남은 일수 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">기준일에 입국하면 최대 연속 체류</span><span class="result-value" id="sgM">-</span></div>
<div class="result-row"><span class="result-label">그 경우 마지막 체류일</span><span class="result-value" id="sgL" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">기준일 직전 180일 안 사용 일수</span><span class="result-value" id="sgU" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _d(i){var v=document.getElementById(i).value;if(!v)return null;var p=v.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000;}
function _s(i,t){document.getElementById(i).textContent=t;}
function _f(n){var d=new Date(n*86400000);return d.getUTCFullYear()+'. '+(d.getUTCMonth()+1)+'. '+d.getUTCDate()+'.';}
function calc_schengen_90_180(){
 var st={},i,a,b,k,c=_d('sg9');
 if(c===null) return alert('다음 입국 예정일을 입력해주세요.');
 for(i=1;i<=3;i++){a=_d('sg'+i+'a');b=_d('sg'+i+'b');if(a===null&&b===null)continue;if(a===null||b===null)return alert('여행 '+i+'의 입국일과 출국일을 모두 넣어주세요.');if(b<a)return alert('여행 '+i+'의 출국일이 입국일보다 빠릅니다.');if(b>=c)return alert('여행 '+i+'이 기준일과 겹칩니다. 기준일은 지난 여행 뒤 날짜여야 합니다.');for(k=a;k<=b;k++)st[k]=1;}
 var used=0;for(k=c-180;k<c;k++)if(st[k])used++;
 var stay=0,d=c;
 while(stay<400){st[d]=1;var cnt=0;for(k=d-179;k<=d;k++)if(st[k])cnt++;if(cnt>90){delete st[d];break;}stay++;d++;}
 _s('sgM',stay>=400?'90일 이상 (제한 없음)':stay+'일'); _s('sgL',stay<1?'지금은 입국할 수 없습니다':_f(c+stay-1)); _s('sgU',used+'일 / 90일');
 document.getElementById('result').classList.add('show');
}
</script>
