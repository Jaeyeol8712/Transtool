<label for="orgPrice">원래 가격 (원)</label>
<input id="orgPrice" placeholder="예: 50000" type="number"/>
<label for="discPercent">할인율 (%)</label>
<input id="discPercent" placeholder="예: 20" type="number"/>
<button onclick="calcDiscount()">할인 계산하기</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">할인 금액</span><span class="result-value" id="discAmount" style="color:var(--text); font-size:1.1rem;">-</span></div>
<div class="result-row"><span class="result-label">최종 결제 금액</span><span class="result-value" id="finalPrice" style="color:#ef4444;">-</span></div>
</div>
<script>
 function calcDiscount(){
 const price = parseFloat(document.getElementById('orgPrice').value);
 const percent = parseFloat(document.getElementById('discPercent').value);
 if(!price || !percent) return alert('가격을 모두 입력해주세요.');
 const discount = price * (percent / 100);
 const final = price - discount;
 document.getElementById('discAmount').textContent = Math.round(discount).toLocaleString() + '원 절약';
 document.getElementById('finalPrice').textContent = Math.round(final).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
 }
 </script>
