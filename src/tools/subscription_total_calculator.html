<p style="margin:0 0 .5rem;font-size:15px">구독 이름은 비워 둬도 됩니다. 요금은 내 결제 내역의 금액을 넣으세요.</p>
<div id="sbRows"></div>
<button type="button" onclick="sbAdd()" style="background:var(--card);color:var(--text);border:1px solid var(--border);margin-bottom:.5rem">+ 구독 추가</button>
<button onclick="calcSb()">합계 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">한 달 합계</span><span class="result-value" id="sbM">-</span></div>
<div class="result-row"><span class="result-label">1년 합계</span><span class="result-value" id="sbY" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">가장 비싼 구독 (월 환산)</span><span class="result-value" id="sbTop" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
var sbN=0;
function sbAdd(){var i=sbN++,d=document.createElement('div');
 d.innerHTML='<label for="sbName'+i+'">구독 '+(i+1)+'</label><input id="sbName'+i+'" type="text" placeholder="이름 (선택)"/>'+
 '<input id="sbFee'+i+'" type="number" inputmode="numeric" placeholder="요금 (원)" aria-label="구독 '+(i+1)+' 요금"/>'+
 '<select id="sbCy'+i+'" aria-label="구독 '+(i+1)+' 결제 주기"><option value="1">매월 결제</option><option value="12">매년 결제</option></select>';
 document.getElementById('sbRows').appendChild(d);}
for(var k=0;k<4;k++) sbAdd();
function sbCalc(items){var m=0,top=null;items.forEach(function(it){var v=it.fee/it.cycle;m+=v;if(!top||v>top.v)top={name:it.name,v:v};});return {m:m,y:m*12,top:top};}
function calcSb(){
 var items=[];for(var i=0;i<sbN;i++){var f=parseFloat(document.getElementById('sbFee'+i).value);
  if(!isNaN(f)&&f>0) items.push({name:document.getElementById('sbName'+i).value||('구독 '+(i+1)),fee:f,cycle:parseInt(document.getElementById('sbCy'+i).value,10)});}
 if(!items.length) return alert('요금을 하나 이상 입력해주세요.');
 var o=sbCalc(items);
 function w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
 document.getElementById('sbM').textContent=w(o.m)+' ('+items.length+'개)';
 document.getElementById('sbY').textContent=w(o.y);
 document.getElementById('sbTop').textContent=o.top.name+' · 월 '+w(o.top.v);
 document.getElementById('result').classList.add('show');
}
</script>
