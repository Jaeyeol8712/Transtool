<label for="ucType">종류</label>
<select id="ucType"><option value="len">길이</option><option value="wt">무게</option><option value="temp">온도</option></select>
<label for="ucVal">값</label>
<input id="ucVal" type="number" step="any" inputmode="decimal" placeholder="1"/>
<label for="ucFrom">단위</label>
<select id="ucFrom"></select>
<button onclick="calcUc()">변환</button>
<div class="result" id="result"><div id="ucOut" style="font-size:.98rem;line-height:1.9"></div></div>
<script>
var U={len:[['mm',0.001],['cm',0.01],['m',1],['km',1000],['인치(in)',0.0254],['피트(ft)',0.3048],['야드(yd)',0.9144],['마일(mi)',1609.344]],
 wt:[['g',1],['kg',1000],['톤(t)',1000000],['파운드(lb)',453.59237],['온스(oz)',28.349523125],['근(고기 600g)',600],['근(채소 375g)',375]],
 temp:[['섭씨(℃)',0],['화씨(℉)',0]]};
function fill(){var t=document.getElementById('ucType').value, s=document.getElementById('ucFrom'); s.innerHTML='';
 U[t].forEach(function(u,i){var o=document.createElement('option'); o.value=i; o.textContent=u[0]; s.appendChild(o);});}
document.getElementById('ucType').onchange=fill; fill();
function nf(x){return (Math.round(x*1e6)/1e6).toLocaleString('ko-KR',{maximumFractionDigits:6});}
function calcUc(){
 var t=document.getElementById('ucType').value, v=parseFloat(document.getElementById('ucVal').value), i=+document.getElementById('ucFrom').value;
 if(isNaN(v)) return alert('값을 입력해주세요.');
 var out='';
 if(t==='temp'){ out = i===0 ? nf(v)+' ℃ = <b>'+nf(v*9/5+32)+' ℉</b>' : nf(v)+' ℉ = <b>'+nf((v-32)*5/9)+' ℃</b>'; }
 else { var base=v*U[t][i][1]; U[t].forEach(function(u,j){ if(j!==i) out+=nf(v)+' '+U[t][i][0]+' = <b>'+nf(base/u[1])+' '+u[0]+'</b><br>'; }); }
 document.getElementById('ucOut').innerHTML=out;
 document.getElementById('result').classList.add('show');
}
</script>
