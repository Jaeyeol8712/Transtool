<label for="kjN">배추 포기 수</label>
<input id="kjN" type="number" inputmode="numeric" value="20"/>
<p style="margin:.2rem 0 .6rem;line-height:1.6">무·고춧가루는 aT 조사 기준 비율(배추 20포기에 무 5개, 고춧가루 2kg)로 자동 계산합니다. 단가는 aT KAMIS 2026년 10월 16일 소매가격이며 바꿀 수 있습니다.</p>
<label for="kjCab">배추 1포기 가격 (원)</label><input id="kjCab" type="number" inputmode="numeric" value="5557"/>
<label for="kjRad">무 1개 가격 (원)</label><input id="kjRad" type="number" inputmode="numeric" value="2262"/>
<label for="kjPep">고춧가루 1kg 가격 (원)</label><input id="kjPep" type="number" inputmode="numeric" value="31696"/>
<label for="kjEtc">그 밖의 재료 합계 (마늘·젓갈·소금·쪽파 등, 원)</label><input id="kjEtc" type="number" inputmode="numeric" placeholder="50000"/>
<label for="kjPpl">나눌 가구 수</label><input id="kjPpl" type="number" inputmode="numeric" value="1"/>
<button onclick="calcKj()">김장 비용 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">배추</span><span class="result-value" id="kjA" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">무</span><span class="result-value" id="kjB" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">고춧가루</span><span class="result-value" id="kjC" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">총 비용</span><span class="result-value" id="kjSum">-</span></div>
<div class="result-row"><span class="result-label">가구당</span><span class="result-value" id="kjPer" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function calcKj(){
 var g=function(id){return parseFloat(document.getElementById(id).value)||0;};
 var n=g('kjN'); if(!(n>0)) return alert('배추 포기 수를 입력해주세요.');
 var radN=Math.ceil(n/4), pepKg=n/10;
 var a=n*g('kjCab'), b=radN*g('kjRad'), c=pepKg*g('kjPep'), sum=a+b+c+g('kjEtc'), ppl=g('kjPpl')||1;
 var f=function(x){return Math.round(x).toLocaleString('ko-KR')+'원';};
 document.getElementById('kjA').textContent=n+'포기 · '+f(a);
 document.getElementById('kjB').textContent=radN+'개 · '+f(b);
 document.getElementById('kjC').textContent=pepKg.toFixed(1)+'kg · '+f(c);
 document.getElementById('kjSum').textContent=f(sum);
 document.getElementById('kjPer').textContent=f(sum/ppl);
 document.getElementById('result').classList.add('show');
}
</script>
