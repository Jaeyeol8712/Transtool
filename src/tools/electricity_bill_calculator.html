<label for="kwh">이번 달 전기 사용량 (kWh)</label>
<input id="kwh" placeholder="예: 350" type="number"/>
<label for="season">적용 계절</label>
<select id="season">
<option value="normal">일반 (1~6월, 9~12월)</option>
<option value="summer">하계 완화 구간 (7~8월)</option>
</select>
<button onclick="calcElec()">전기요금 계산하기</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">기본요금</span><span class="result-value" id="basicFee">-</span></div>
<div class="result-row"><span class="result-label">전력량요금</span><span class="result-value" id="energyFee">-</span></div>
<div class="result-row"><span class="result-label">기후환경요금+연료비조정요금</span><span class="result-value" id="extraFee">-</span></div>
<div class="result-row"><span class="result-label">부가세+전력기반기금</span><span class="result-value" id="taxFee">-</span></div>
<div class="result-row"><span class="result-label">예상 청구액</span><span class="result-value" id="totalFee">-</span></div>
</div>
<script>
 function calcElec(){
 const kwh = parseFloat(document.getElementById('kwh').value);
 const summer = document.getElementById('season').value === 'summer';
 if(!kwh || kwh <= 0) return alert('전기 사용량을 입력해주세요.');
 const t1 = summer ? 300 : 200;
 const t2 = summer ? 450 : 400;
 let basic, energy;
 if(kwh <= t1){ basic = 910; energy = kwh * 120.0; }
 else if(kwh <= t2){ basic = 1600; energy = t1*120.0 + (kwh-t1)*214.6; }
 else { basic = 7300; energy = t1*120.0 + (t2-t1)*214.6 + (kwh-t2)*307.3; }
 const climate = kwh * 9;
 const fuel = kwh * 5;
 const subtotal = basic + energy + climate + fuel;
 const vat = subtotal * 0.1;
 const fund = subtotal * 0.037;
 const total = subtotal + vat + fund;
 document.getElementById('basicFee').textContent = Math.round(basic).toLocaleString() + '원';
 document.getElementById('energyFee').textContent = Math.round(energy).toLocaleString() + '원';
 document.getElementById('extraFee').textContent = Math.round(climate+fuel).toLocaleString() + '원';
 document.getElementById('taxFee').textContent = Math.round(vat+fund).toLocaleString() + '원';
 document.getElementById('totalFee').textContent = Math.round(total).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
 }
 </script>
