<label for="saP1">지금 평균 단가 (원)</label>
<input id="saP1" type="number" inputmode="decimal" placeholder="70000"/>
<label for="saQ1">지금 보유 수량 (주)</label>
<input id="saQ1" type="number" inputmode="decimal" placeholder="10"/>
<label for="saP2">추가 매수 가격 (원)</label>
<input id="saP2" type="number" inputmode="decimal" placeholder="55000"/>
<label for="saQ2">추가 매수 수량 (주)</label>
<input id="saQ2" type="number" inputmode="decimal" placeholder="10"/>
<label for="saC">현재가 (원, 선택)</label>
<input id="saC" type="number" inputmode="decimal" placeholder="55000"/>
<button onclick="calcSa()">평단가 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">새 평균 단가</span><span class="result-value" id="saOut">-</span></div>
<div class="result-row"><span class="result-label">총 수량 / 총 매수 금액</span><span class="result-value" id="saQ" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">현재가 기준 수익률</span><span class="result-value" id="saR" style="font-size:1.1rem;color:var(--text);">-</span></div>
<p id="saMsg" style="margin:.6rem 0 0;line-height:1.6"></p>
</div>
<script>
function calcSa(){
 function v(id){return parseFloat(document.getElementById(id).value);}
 var p1=v('saP1'),q1=v('saQ1'),p2=v('saP2'),q2=v('saQ2'),c=v('saC');
 if([p1,q1,p2,q2].some(isNaN)||q1+q2<=0) return alert('단가와 수량을 입력해주세요.');
 var amt=p1*q1+p2*q2,q=q1+q2,avg=amt/q;
 function w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
 document.getElementById('saOut').textContent=w(avg);
 document.getElementById('saQ').textContent=q.toLocaleString('ko-KR')+'주 / '+w(amt);
 if(!isNaN(c)&&c>0){var r=(c/avg-1)*100;document.getElementById('saR').textContent=(r>=0?'+':'')+r.toFixed(2)+'%';
  document.getElementById('saMsg').textContent='물타기 전 수익률은 '+((c/p1-1)*100).toFixed(2)+'%입니다. 본전이 되려면 주가가 '+w(avg)+'까지 올라야 합니다(수수료·세금 제외).';}
 else{document.getElementById('saR').textContent='-';document.getElementById('saMsg').textContent='';}
 document.getElementById('result').classList.add('show');
}
</script>
