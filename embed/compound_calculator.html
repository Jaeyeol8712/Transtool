<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복리 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/compound_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=5d3157ea">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="복리 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">복리 계산기</p>
<label for="compPrincipal">초기 원금 (원)</label>
<input id="compPrincipal" placeholder="예: 10000000" type="number"/>
<label for="compRate">연 수익률 (%)</label>
<input id="compRate" placeholder="예: 7" type="number"/>
<label for="compYears">투자 기간 (년)</label>
<input id="compYears" placeholder="예: 10" type="number"/>
<button onclick="calcCompound()">복리 수익 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">순수익 (이자)</span><span class="result-value" id="compInterest" style="color:var(--text); font-size:1.1rem;">-</span></div>
<div class="result-row"><span class="result-label">최종 자산 합계</span><span class="result-value" id="compTotal">-</span></div>
</div>
<script>
function calcCompound(){
 const p = parseFloat(document.getElementById('compPrincipal').value);
 const r = parseFloat(document.getElementById('compRate').value) / 100;
 const t = parseInt(document.getElementById('compYears').value);
 if(!p || !r || !t) return alert('모두 입력해주세요.');
 const total = p * Math.pow((1 + r), t);
 const interest = total - p;
 document.getElementById('compInterest').textContent = Math.round(interest).toLocaleString() + '원';
 document.getElementById('compTotal').textContent = Math.round(total).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/compound_calculator.html" target="_blank" rel="noopener">어라운드툴 복리 계산기</a></p>
</body>
</html>
