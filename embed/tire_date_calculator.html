<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이어 제조일자 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/tire_date_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=fbec76a8">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="타이어 제조일자 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">타이어 제조일자 계산기</p>
<label for="dotNum">타이어 DOT 번호 끝 4자리 (예: 2526)</label>
<input id="dotNum" placeholder="예: 3125" type="number"/>
<button onclick="calcTire()">제조일자 확인</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">생산 시기</span><span class="result-value" id="tireDate">-</span></div>
<div class="result-row"><span class="result-label">추정 생산월</span><span class="result-value" id="tireMonth" style="font-size:1.1rem; color:var(--text);">-</span></div>
</div>
<script>
 function calcTire(){
 const val = document.getElementById('dotNum').value;
 if(val.length !== 4) return alert('4자리 숫자를 입력해주세요.');
 const week = parseInt(val.substring(0,2));
 const year = parseInt(val.substring(2,4));
 if(week < 1 || week > 53) return alert('올바른 주차(01~53)를 입력하세요.');
 const month = Math.ceil(week / 4.345);
 document.getElementById('tireDate').textContent = `20${year}년 ${week}번째 주`;
 document.getElementById('tireMonth').textContent = `대략 ${month}월경 생산됨`;
 document.getElementById('result').classList.add('show');
 }
 </script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/tire_date_calculator.html" target="_blank" rel="noopener">어라운드툴 타이어 제조일자 계산기</a></p>
</body>
</html>
