<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>만 나이 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/age_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=39b56cea">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="만 나이 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">만 나이 계산기</p>
<label for="ageB">생년월일</label>
<input id="ageB" type="date"/>
<label for="ageT">기준일 (기본: 오늘)</label>
<input id="ageT" type="date"/>
<button onclick="calcAge2()">만 나이 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">만 나이</span><span class="result-value" id="manAgeRes">-</span></div>
<div class="result-row"><span class="result-label">태어난 띠</span><span class="result-value" id="zodiacRes" style="font-size:1.1rem; color:var(--text);">-</span></div>
</div>
<script>
document.getElementById('ageT').valueAsDate = new Date();
function calcAge2(){
 const b = new Date(document.getElementById('ageB').value);
 const t = new Date(document.getElementById('ageT').value);
 if(isNaN(b)) return alert('생년월일을 입력해주세요.');
 let manAge = t.getFullYear() - b.getFullYear();
 const m = t.getMonth() - b.getMonth();
 if(m < 0 || (m === 0 && t.getDate() < b.getDate())) manAge--;
 const zodiacs = ['원숭이','닭','개','돼지','쥐','소','호랑이','토끼','용','뱀','말','양'];
 const z = zodiacs[b.getFullYear() % 12] + '띠';
 document.getElementById('manAgeRes').textContent = manAge + '세';
 document.getElementById('zodiacRes').textContent = z;
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/age_calculator.html" target="_blank" rel="noopener">어라운드툴 만 나이 계산기</a></p>
</body>
</html>
