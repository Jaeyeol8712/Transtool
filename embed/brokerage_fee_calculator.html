<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 중개보수 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/brokerage_fee_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=a06e0150">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="부동산 중개보수 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">부동산 중개보수 계산기</p>
<label for="tradeType">거래 종류</label>
<select id="tradeType">
<option value="sell">매매/교환</option>
<option value="rent">전월세/임대차</option>
</select>
<label for="tradePrice">거래 금액 (원, 월세인 경우 환산보증금)</label>
<input id="tradePrice" placeholder="예: 500000000" type="number"/>
<button onclick="calcBroker()">중개보수 계산하기</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">상한 요율</span><span class="result-value" id="brokerRate" style="font-size:1.1rem;">-</span></div>
<div class="result-row"><span class="result-label">최대 중개보수 (부가세 별도)</span><span class="result-value" id="brokerFee">-</span></div>
</div>
<script>
function calcBroker(){
 const type = document.getElementById('tradeType').value;
 const price = parseFloat(document.getElementById('tradePrice').value);
 if(!price) return alert('거래 금액을 입력해주세요.');
 let rate = 0, limit = 0;
 if(type === 'sell'){
 if(price < 50000000) { rate = 0.006; limit = 250000; }
 else if(price < 200000000) { rate = 0.005; limit = 800000; }
 else if(price < 900000000) { rate = 0.004; limit = 0; }
 else if(price < 1200000000) { rate = 0.005; limit = 0; }
 else if(price < 1500000000) { rate = 0.006; limit = 0; }
 else { rate = 0.007; limit = 0; }
 } else {
 if(price < 50000000) { rate = 0.005; limit = 200000; }
 else if(price < 100000000) { rate = 0.004; limit = 300000; }
 else if(price < 600000000) { rate = 0.003; limit = 0; }
 else if(price < 1200000000) { rate = 0.004; limit = 0; }
 else if(price < 1500000000) { rate = 0.005; limit = 0; }
 else { rate = 0.006; limit = 0; }
 }
 let fee = price * rate;
 if(limit > 0 && fee > limit) fee = limit;
 document.getElementById('brokerRate').textContent = (rate * 100).toFixed(1) + '%';
 document.getElementById('brokerFee').textContent = Math.round(fee).toLocaleString() + '원';
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/brokerage_fee_calculator.html" target="_blank" rel="noopener">어라운드툴 부동산 중개보수 계산기</a></p>
</body>
</html>
