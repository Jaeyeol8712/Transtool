<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 현금 환전 금액 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/travel_cash_amount_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=ca681796">
<style>html body{background:#fff!important}.at-tool{margin:0;max-width:none;border:1px solid var(--at-line-2);border-radius:16px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="여행 현금 환전 금액 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">여행 현금 환전 금액 계산기</p>
<label for="tc1">여행 일수 (일)</label>
<input id="tc1" type="number" inputmode="numeric" placeholder="예: 4"/>
<label for="tc2">하루 현지 지출, 1인 (현지 돈)</label>
<input id="tc2" type="number" inputmode="decimal" placeholder="식비·교통·입장료, 예: 8000 (엔)"/>
<label for="tc3">인원 (명)</label>
<input id="tc3" type="number" inputmode="numeric" placeholder="1"/>
<label for="tc4">그중 현금으로 낼 비율 (%)</label>
<input id="tc4" type="number" inputmode="decimal" value="30"/>
<label for="tc5">비상금 여유 (%)</label>
<input id="tc5" type="number" inputmode="decimal" value="20"/>
<label for="tc6">환율 (원/현지 돈 1단위)</label>
<input id="tc6" type="number" inputmode="decimal" placeholder="엔이면 9.5, 달러면 1400"/>
<label for="tc7">환전 단위 (현지 돈)</label>
<select id="tc7"><option value="1000" selected>1,000 단위 (엔 등)</option><option value="10">10 단위 (달러·유로 등)</option><option value="100">100 단위 (바트·대만달러 등)</option><option value="100000">100,000 단위 (동 등)</option></select>
<button onclick="calc_travel_cash_amount()">환전 금액 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">환전할 현지 돈</span><span class="result-value" id="tcL">-</span></div>
<div class="result-row"><span class="result-label">원화로</span><span class="result-value" id="tcK" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">카드로 쓸 금액</span><span class="result-value" id="tcC" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">전체 현지 지출</span><span class="result-value" id="tcT" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _n(x){return Math.round(x).toLocaleString('ko-KR');}
function calc_travel_cash_amount(){
 var d=_v('tc1'),s=_v('tc2'),n=_v('tc3'),c=_v('tc4'),b=_v('tc5'),x=_v('tc6'),u=parseFloat(document.getElementById('tc7').value);
 if(isNaN(d)||d<1||isNaN(s)||s<=0) return alert('여행 일수와 하루 지출을 입력해주세요.');
 if(isNaN(n)||n<1)n=1; if(isNaN(c)||c<0)c=0; if(c>100)c=100; if(isNaN(b)||b<0)b=0;
 var tot=d*s*n,cash=tot*c/100*(1+b/100),r=Math.ceil(cash/u)*u;
 _s('tcL',_n(r)+' (계산값 '+_n(cash)+')'); _s('tcK',isNaN(x)||x<=0?'환율을 넣으면 나옵니다':_n(r*x)+'원');
 _s('tcC',_n(tot*(1-c/100))+(isNaN(x)||x<=0?'':' (약 '+_n(tot*(1-c/100)*x)+'원)')); _s('tcT',_n(tot));
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/travel_cash_amount_calculator.html?utm_source=embed&amp;utm_campaign=travel_cash_amount_calculator" target="_blank" rel="noopener">어라운드툴 여행 현금 환전 금액 계산기</a></p>
</body>
</html>
