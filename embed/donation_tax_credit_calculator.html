<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기부금 세액공제 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/donation_tax_credit_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=bbc86717">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="기부금 세액공제 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">기부금 세액공제 계산기</p>
<label for="dnG">일반 기부금 (법정·지정 기부금, 원)</label>
<input id="dnG" type="number" inputmode="numeric" placeholder="500000"/>
<label for="dnH">고향사랑기부금 (원)</label>
<input id="dnH" type="number" inputmode="numeric" placeholder="100000"/>
<label for="dnP">정치자금 기부금 (원)</label>
<input id="dnP" type="number" inputmode="numeric" placeholder="0"/>
<button onclick="calcDn()">세액공제 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">일반 기부금 공제</span><span class="result-value" id="dnOg" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">고향사랑기부 공제</span><span class="result-value" id="dnOh" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">정치자금 공제</span><span class="result-value" id="dnOp" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">합계 (지방소득세 포함)</span><span class="result-value" id="dnOut">-</span></div>
<p style="margin:.6rem 0 0;line-height:1.6">낸 세금(결정세액)보다 많이 돌려받을 수는 없습니다. 일반 기부금은 소득 대비 한도가 따로 있습니다.</p>
</div>
<script>
function dnV(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)||v<0?0:v;}
function calcDn(){
 var g=dnV('dnG'),h=dnV('dnH'),p=dnV('dnP');
 if(g+h+p<=0) return alert('기부금을 하나 이상 입력해주세요.');
 /* 일반: 1천만 원 이하 15%, 초과 30% (+지방소득세 10%) */
 var cg=(Math.min(g,10000000)*0.15+Math.max(0,g-10000000)*0.30)*1.1;
 /* 고향사랑(2026 기부분): 10만 원까지 전액(110분의 100 + 지방소득세), 10만~20만 원 44%, 초과 16.5% */
 var ch=Math.min(h,100000)+Math.max(0,Math.min(h,200000)-100000)*0.44+Math.max(0,h-200000)*0.165;
 /* 정치자금: 10만 원까지 전액, 초과 3천만 원 이하 16.5%, 3천만 원 초과 27.5% */
 var cp=Math.min(p,100000)+Math.max(0,Math.min(p,30000000)-100000)*0.165+Math.max(0,p-30000000)*0.275;
 function w(n){return Math.floor(n).toLocaleString('ko-KR')+'원';}
 document.getElementById('dnOg').textContent=w(cg);
 document.getElementById('dnOh').textContent=w(ch);
 document.getElementById('dnOp').textContent=w(cp);
 document.getElementById('dnOut').textContent=w(cg+ch+cp);
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/donation_tax_credit_calculator.html?utm_source=embed&amp;utm_campaign=donation_tax_credit_calculator" target="_blank" rel="noopener">어라운드툴 기부금 세액공제 계산기</a></p>
</body>
</html>
