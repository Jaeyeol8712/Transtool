<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더치페이 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/dutch_pay_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=a06e0150">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="더치페이 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">더치페이 계산기</p>
<label for="dutchTotal">총 결제 금액 (원)</label>
<input id="dutchTotal" placeholder="예: 153000" type="number"/>
<label for="dutchPeople">나눌 인원 수 (명)</label>
<input id="dutchPeople" placeholder="예: 4" type="number"/>
<button onclick="calcDutch()">더치페이 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">1인당 부담액</span><span class="result-value" id="dutchPer">-</span></div>
<div class="result-row"><span class="result-label">단수 차액 (총무 부담 등)</span><span class="result-value" id="dutchRem" style="font-size:1rem; color:var(--text);">-</span></div>
</div>
<script>
 function calcDutch(){
 const t = parseFloat(document.getElementById('dutchTotal').value);
 const p = parseInt(document.getElementById('dutchPeople').value);
 if(!t || !p || p < 1) return alert('정확한 금액과 인원을 입력해주세요.');
 const rawPer = Math.ceil((t / p) / 100) * 100;
 const rem = (rawPer * p) - t;
 document.getElementById('dutchPer').textContent = rawPer.toLocaleString() + '원';
 document.getElementById('dutchRem').textContent = rem > 0 ? `+${rem.toLocaleString()}원 남음` : '딱 떨어짐';
 document.getElementById('result').classList.add('show');
 }
 </script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/dutch_pay_calculator.html" target="_blank" rel="noopener">어라운드툴 더치페이 계산기</a></p>
</body>
</html>
