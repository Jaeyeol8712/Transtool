<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배당금 세후 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/dividend_tax_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=5d66ddb2">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="배당금 세후 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">배당금 세후 계산기</p>
<label for="dvA">세전 배당금 (원)</label>
<input id="dvA" type="number" inputmode="numeric" placeholder="1000000"/>
<label for="dvT">과세 방식</label>
<select id="dvT"><option value="g" selected>일반 배당 (원천징수 15.4%)</option><option value="h">고배당기업 분리과세 선택 (14~30% + 지방세)</option></select>
<label for="dvO">올해 다른 이자·배당 소득 (원, 일반 배당일 때 종합과세 확인용)</label>
<input id="dvO" type="number" inputmode="numeric" placeholder="0"/>
<button onclick="calcDv()">세후 배당금 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">세후 배당금</span><span class="result-value" id="dvOut">-</span></div>
<div class="result-row"><span class="result-label">소득세 / 지방소득세</span><span class="result-value" id="dvTx" style="font-size:1.1rem;color:var(--text);">-</span></div>
<p id="dvMsg" style="margin:.6rem 0 0;line-height:1.6"></p>
</div>
<script>
function hiTax(a){var t=0,b=[[20000000,.14],[300000000,.20],[5000000000,.25],[Infinity,.30]],lo=0;
 for(var i=0;i<b.length;i++){if(a>lo){t+=(Math.min(a,b[i][0])-lo)*b[i][1];}lo=b[i][0];}return t;}
function calcDv(){
 var a=parseFloat(document.getElementById('dvA').value),o=parseFloat(document.getElementById('dvO').value)||0,t=document.getElementById('dvT').value;
 if(isNaN(a)||a<=0) return alert('배당금을 입력해주세요.');
 var it=t==='g'?Math.floor(a*0.14/10)*10:Math.floor(hiTax(a)/10)*10,lt=Math.floor(it*0.1/10)*10;
 function w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
 document.getElementById('dvOut').textContent=w(a-it-lt);
 document.getElementById('dvTx').textContent=w(it)+' / '+w(lt);
 var m='';
 if(t==='g'){m=(a+o>20000000)?'이자·배당 합계가 2천만 원을 넘어 금융소득 종합과세 대상입니다. 넘는 부분은 다음 해 5월 다른 소득과 합쳐 다시 계산합니다.':'이자·배당 합계 2천만 원 이하라 원천징수로 끝납니다.';}
 else{m='고배당기업 배당만 해당하며, 그 회사가 요건을 갖췄는지 공시를 확인하세요. 실효세율 '+((it+lt)/a*100).toFixed(2)+'%.';}
 document.getElementById('dvMsg').textContent=m;
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/dividend_tax_calculator.html?utm_source=embed&amp;utm_campaign=dividend_tax_calculator" target="_blank" rel="noopener">어라운드툴 배당금 세후 계산기</a></p>
</body>
</html>
