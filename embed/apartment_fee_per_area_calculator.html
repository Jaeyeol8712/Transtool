<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리비 평당 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/apartment_fee_per_area_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=686f0e48">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="관리비 평당 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">관리비 평당 계산기</p>
<label for="af1">한 달 관리비 (원)</label>
<input id="af1" type="number" inputmode="numeric" placeholder="250000"/>
<label for="af2">면적</label>
<input id="af2" type="number" inputmode="decimal" placeholder="84"/>
<label for="af3">면적 단위</label>
<select id="af3"><option value="m2" selected>㎡ (전용·공급 중 고지서 기준)</option><option value="py">평</option></select>
<button onclick="calc_apartment_fee_per_area()">평당 관리비 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">평당 관리비</span><span class="result-value" id="afP">-</span></div>
<div class="result-row"><span class="result-label">㎡당 관리비</span><span class="result-value" id="afM" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">1년 관리비</span><span class="result-value" id="afY" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_apartment_fee_per_area(){
 var f=_v('af1'),a=_v('af2'),u=document.getElementById('af3').value;
 if(isNaN(f)||f<=0||isNaN(a)||a<=0) return alert('관리비와 면적을 입력해주세요.');
 var m2=u==='py'?a*3.305785:a, py=m2/3.305785;
 _s('afP',_w(f/py)); _s('afM',_w(f/m2)); _s('afY',_w(f*12));
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/apartment_fee_per_area_calculator.html?utm_source=embed&amp;utm_campaign=apartment_fee_per_area_calculator" target="_blank" rel="noopener">어라운드툴 관리비 평당 계산기</a></p>
</body>
</html>
