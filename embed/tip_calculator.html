<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외 팁 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/tip_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=bbadff28">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="해외 팁 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">해외 팁 계산기</p>
<label for="tp1">음식값 (현지 통화)</label>
<input id="tp1" type="number" inputmode="decimal" placeholder="80"/>
<label for="tp2">팁 비율</label>
<select id="tp2"><option value="10">10%</option><option value="15">15%</option><option value="18" selected>18%</option><option value="20">20%</option><option value="22">22%</option></select>
<label for="tp3">인원 (명)</label>
<input id="tp3" type="number" inputmode="numeric" placeholder="2"/>
<label for="tp4">환율 (원, 선택 · 현지 1단위당)</label>
<input id="tp4" type="number" inputmode="decimal" placeholder="1400"/>
<button onclick="calc_tip()">팁 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">팁</span><span class="result-value" id="tpT">-</span></div>
<div class="result-row"><span class="result-label">팁 포함 합계</span><span class="result-value" id="tpS" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">1인당</span><span class="result-value" id="tpP" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">원화 환산 (합계)</span><span class="result-value" id="tpK" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_tip(){
 var b=_v('tp1'),p=parseFloat(document.getElementById('tp2').value)/100,n=_v('tp3'),x=_v('tp4');
 if(isNaN(b)||b<=0) return alert('음식값을 입력해주세요.'); if(isNaN(n)||n<1)n=1;
 var t=b*p,s=b+t;
 _s('tpT',_n(t,2)); _s('tpS',_n(s,2)); _s('tpP',_n(s/n,2)); _s('tpK',isNaN(x)||x<=0?'환율을 넣으면 표시됩니다':_w(s*x));
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/tip_calculator.html?utm_source=embed&amp;utm_campaign=tip_calculator" target="_blank" rel="noopener">어라운드툴 해외 팁 계산기</a></p>
</body>
</html>
