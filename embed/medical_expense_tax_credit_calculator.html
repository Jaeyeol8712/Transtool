<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의료비 세액공제 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/medical_expense_tax_credit_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=686f0e48">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="의료비 세액공제 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">의료비 세액공제 계산기</p>
<label for="mePay">총급여 (만 원)</label>
<input id="mePay" type="number" inputmode="numeric" placeholder="5000"/>
<label for="meSelf">본인·65세 이상·장애인·6세 이하 의료비 (만 원)</label>
<input id="meSelf" type="number" inputmode="numeric" placeholder="200"/>
<label for="meFam">그 밖의 가족 의료비 (만 원, 한도 700만 원)</label>
<input id="meFam" type="number" inputmode="numeric" placeholder="150"/>
<label for="mePre">미숙아·선천성 이상아 의료비 (만 원)</label>
<input id="mePre" type="number" inputmode="numeric" placeholder="0"/>
<label for="meIvf">난임 시술비 (만 원)</label>
<input id="meIvf" type="number" inputmode="numeric" placeholder="0"/>
<button onclick="calcMe()">의료비 세액공제 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">총급여 3% (이 금액을 넘어야 공제)</span><span class="result-value" id="meMin" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">공제 대상 의료비</span><span class="result-value" id="meBase" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">세금에서 빼는 금액</span><span class="result-value" id="meTax">-</span></div>
<p id="meMsg" style="margin:.6rem 0 0;line-height:1.6"></p>
</div>
<script>
function calcMe(){
 var g=function(id){return (parseFloat(document.getElementById(id).value)||0)*1e4;};
 var pay=g('mePay'),b=[g('meFam'),g('meSelf'),g('mePre'),g('meIvf')],rate=[.15,.15,.2,.3];
 if(!(pay>0)) return alert('총급여를 입력해주세요.');
 var rest=pay*.03;
 for(var i=0;i<4;i++){var c=Math.min(b[i],rest);b[i]-=c;rest-=c;}
 b[0]=Math.min(b[0],7e6);
 var tax=0,base=0;for(i=0;i<4;i++){tax+=b[i]*rate[i];base+=b[i];}
 var w=function(n){return Math.round(n).toLocaleString('ko-KR')+'원';};
 document.getElementById('meMin').textContent=w(pay*.03);
 document.getElementById('meBase').textContent=w(base);
 document.getElementById('meTax').textContent=w(Math.floor(tax));
 document.getElementById('meMsg').textContent=base>0?'공제율: 일반 15%, 미숙아·선천성 이상아 20%, 난임 시술 30%. 실손보험으로 돌려받은 금액은 빼고 넣으세요.':'의료비가 총급여의 3%를 넘지 않아 공제가 없습니다.';
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/medical_expense_tax_credit_calculator.html?utm_source=embed&amp;utm_campaign=medical_expense_tax_credit_calculator" target="_blank" rel="noopener">어라운드툴 의료비 세액공제 계산기</a></p>
</body>
</html>
