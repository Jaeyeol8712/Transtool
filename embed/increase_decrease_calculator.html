<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증감률 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/increase_decrease_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=39b56cea">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="증감률 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">증감률 계산기</p>
<label for="oldVal">이전 값 (기준점)</label>
<input id="oldVal" placeholder="예: 1000" type="number"/>
<label for="newVal">현재 값 (변화점)</label>
<input id="newVal" placeholder="예: 1250" type="number"/>
<button onclick="calcIncDec()">증감율 계산하기</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">변화율 (%)</span><span class="result-value" id="changeRate">-</span></div>
<div class="result-row"><span class="result-label">증감 상태</span><span class="result-value" id="changeStatus" style="font-size:1.1rem;">-</span></div>
</div>
<script>
 function calcIncDec(){
 const oldV = parseFloat(document.getElementById('oldVal').value);
 const newV = parseFloat(document.getElementById('newVal').value);
 if(!oldV || !newV) return alert('값을 모두 입력해주세요.');
 const rate = ((newV - oldV) / oldV) * 100;
 document.getElementById('changeRate').textContent = Math.abs(rate).toFixed(2) + '%';
 const statusEl = document.getElementById('changeStatus');
 if(rate > 0) {
 statusEl.textContent = '▲ 증가 (상승)';
 statusEl.style.color = '#ef4444'; 
 } else if (rate < 0) {
 statusEl.textContent = '▼ 감소 (하락)';
 statusEl.style.color = '#3b82f6';
 } else {
 statusEl.textContent = '변동 없음';
 statusEl.style.color = 'var(--text)';
 }
 document.getElementById('result').classList.add('show');
 }
 </script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/increase_decrease_calculator.html?utm_source=embed&amp;utm_campaign=increase_decrease_calculator" target="_blank" rel="noopener">어라운드툴 증감률 계산기</a></p>
</body>
</html>
