<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평수 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/pyeong_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=970e7e1c">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="평수 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">평수 계산기</p>
<label for="pyeong">평수 (평)</label>
<input id="pyeong" oninput="conv('p')" placeholder="예: 32" type="number"/>
<label for="m2">면적 (㎡)</label>
<input id="m2" oninput="conv('m')" placeholder="예: 105.78" type="number"/>
<script>
 function conv(type){
 const p = document.getElementById('pyeong');
 const m = document.getElementById('m2');
 if(type === 'p' && p.value){
 m.value = (parseFloat(p.value) * 3.305785).toFixed(2);
 } else if(type === 'm' && m.value){
 p.value = (parseFloat(m.value) / 3.305785).toFixed(2);
 } else {
 p.value = ''; m.value = '';
 }
 }
 </script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/pyeong_calculator.html" target="_blank" rel="noopener">어라운드툴 평수 계산기</a></p>
</body>
</html>
