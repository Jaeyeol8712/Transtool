<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페인트 필요량 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/paint_amount_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=d9f2042a">
<style>html body{background:#fff!important}.at-tool{margin:0;max-width:none;border:1px solid var(--at-line-2);border-radius:16px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="페인트 필요량 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">페인트 필요량 계산기</p>
<label for="pt1">칠할 면적 (㎡)</label>
<input id="pt1" type="number" inputmode="decimal" placeholder="30"/>
<label for="pt2">칠 횟수</label>
<input id="pt2" type="number" inputmode="numeric" placeholder="2"/>
<label for="pt3">1L당 칠할 수 있는 면적 (㎡, 제품 표시)</label>
<input id="pt3" type="number" inputmode="decimal" placeholder="10"/>
<label for="pt4">1통 용량 (L)</label>
<input id="pt4" type="number" inputmode="decimal" placeholder="4"/>
<button onclick="calc_paint_amount()">필요량 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">필요한 페인트</span><span class="result-value" id="ptL">-</span></div>
<div class="result-row"><span class="result-label">필요한 통 수</span><span class="result-value" id="ptC" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">참고</span><span class="result-value" id="ptN" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_paint_amount(){
 var a=_v('pt1'),n=_v('pt2'),c=_v('pt3'),v=_v('pt4');
 if(isNaN(a)||a<=0||isNaN(c)||c<=0) return alert('면적과 도포 면적을 입력해주세요.'); if(isNaN(n)||n<1)n=1; if(isNaN(v)||v<=0)v=4;
 var L=a*n/c;
 _s('ptL',_n(L,1)+'L'); _s('ptC',Math.ceil(L/v)+'통'); _s('ptN','벽 상태·색에 따라 더 들 수 있습니다');
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/paint_amount_calculator.html?utm_source=embed&amp;utm_campaign=paint_amount_calculator" target="_blank" rel="noopener">어라운드툴 페인트 필요량 계산기</a></p>
</body>
</html>
