<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가습기 전기요금 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/humidifier_electricity_cost_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=6b26b930">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="가습기 전기요금 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">가습기 전기요금 계산기</p>
<label for="hm1">가습기 소비전력 (W, 제품 표시)</label>
<input id="hm1" type="number" inputmode="decimal" placeholder="30"/>
<label for="hm2">하루 사용 시간 (시간)</label>
<input id="hm2" type="number" inputmode="decimal" placeholder="8"/>
<label for="hm3">사용 일수 (일)</label>
<input id="hm3" type="number" inputmode="numeric" placeholder="30"/>
<label for="hm4">전기요금 단가 (원/kWh, 고지서)</label>
<input id="hm4" type="number" inputmode="decimal" placeholder="고지서 단가"/>
<button onclick="calc_humidifier_electricity_cost()">전기요금 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">사용 기간 전기요금</span><span class="result-value" id="hmT">-</span></div>
<div class="result-row"><span class="result-label">전력 사용량</span><span class="result-value" id="hmK" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">하루 요금</span><span class="result-value" id="hmD" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function _v(i){return parseFloat(document.getElementById(i).value);}
function _s(i,t){document.getElementById(i).textContent=t;}
function _w(x){return Math.round(x).toLocaleString('ko-KR')+'원';}
function _n(x,d){return Number(x.toFixed(d===undefined?1:d)).toLocaleString('ko-KR');}
function calc_humidifier_electricity_cost(){
 var w=_v('hm1'),h=_v('hm2'),d=_v('hm3'),p=_v('hm4');
 if([w,h,d,p].some(function(x){return isNaN(x)||x<=0;})) return alert('소비전력, 사용 시간, 일수, 단가를 입력해주세요.');
 if(h>24) return alert('하루 사용 시간은 24시간 이하로 입력해주세요.');
 var k=w*h*d/1000;
 _s('hmT',_w(k*p)); _s('hmK',_n(k,1)+'kWh'); _s('hmD',_w(k*p/d));
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/humidifier_electricity_cost_calculator.html?utm_source=embed&amp;utm_campaign=humidifier_electricity_cost_calculator" target="_blank" rel="noopener">어라운드툴 가습기 전기요금 계산기</a></p>
</body>
</html>
