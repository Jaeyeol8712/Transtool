<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출산예정일 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/due_date_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=5d3157ea">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="출산예정일 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">출산예정일 계산기</p>
<label for="lmp">최종월경일 (마지막 생리 시작일)</label>
<input id="lmp" type="date"/>
<button onclick="calcDueDate()">출산예정일 계산하기</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">출산예정일</span><span class="result-value" id="dueDate">-</span></div>
<div class="result-row"><span class="result-label">오늘 기준 임신 주수</span><span class="result-value" id="weekValue">-</span></div>
<div class="result-row"><span class="result-label">현재 삼분기</span><span class="result-value" id="trimester" style="font-size:1.1rem;">-</span></div>
</div>
<script>
 function calcDueDate(){
 const lmpStr = document.getElementById('lmp').value;
 if(!lmpStr) return alert('최종월경일을 입력해주세요.');
 const lmp = new Date(lmpStr);
 const due = new Date(lmp.getTime() + 280*24*60*60*1000);
 const today = new Date();
 const diffDays = Math.floor((today - lmp) / (1000*60*60*24));
 const week = Math.floor(diffDays / 7);
 const day = diffDays % 7;
 let tri;
 if(week <= 13) tri = '1삼분기 (초기)';
 else if(week <= 27) tri = '2삼분기 (중기)';
 else tri = '3삼분기 (후기)';
 const dueStr = due.getFullYear() + '년 ' + (due.getMonth()+1) + '월 ' + due.getDate() + '일';
 document.getElementById('dueDate').textContent = dueStr;
 if(diffDays < 0){
 document.getElementById('weekValue').textContent = '최종월경일이 아직 오지 않았습니다';
 document.getElementById('trimester').textContent = '-';
 } else {
 document.getElementById('weekValue').textContent = week + '주 ' + day + '일';
 document.getElementById('trimester').textContent = tri;
 }
 document.getElementById('result').classList.add('show');
 }
 </script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/due_date_calculator.html" target="_blank" rel="noopener">어라운드툴 출산예정일 계산기</a></p>
</body>
</html>
