<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근무시간 계산기 | 어라운드툴</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.aroundtool.com/work_time_calculator.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css?v=4ceb8d1e">
<style>body{background:#fff!important}.at-tool{margin:0;max-width:none;border-radius:8px}
.at-embed-credit{margin:.6rem 0 0;font-size:.8125rem;color:var(--at-sub);text-align:right}
.at-embed-credit a{color:var(--at-ink);font-weight:700;text-decoration:none}.at-embed-credit a:hover{text-decoration:underline}</style>


</head>
<body style="padding:8px">
<section class="at-tool" aria-label="근무시간 계산기">
<p style="margin:0 0 1rem;font-weight:800;font-size:1.0625rem">근무시간 계산기</p>
<label for="wtIn">출근 시각</label>
<input id="wtIn" type="time" value="09:00"/>
<label for="wtOut">퇴근 시각</label>
<input id="wtOut" type="time" value="18:00"/>
<label for="wtBreak">휴게 시간 (분)</label>
<input id="wtBreak" type="number" inputmode="numeric" value="60"/>
<label for="wtDays">한 주 근무일 수</label>
<input id="wtDays" type="number" inputmode="numeric" value="5"/>
<label for="wtWage">시급 (원, 선택)</label>
<input id="wtWage" type="number" inputmode="numeric" placeholder="10320"/>
<button onclick="calcWt()">근무시간 계산</button>
<div class="result" id="result">
<div class="result-row"><span class="result-label">하루 근무시간</span><span class="result-value" id="wtDay">-</span></div>
<div class="result-row"><span class="result-label">한 주 근무시간</span><span class="result-value" id="wtWeek" style="font-size:1.1rem;color:var(--text);">-</span></div>
<div class="result-row"><span class="result-label">일급 (시급 입력 시)</span><span class="result-value" id="wtPay" style="font-size:1.1rem;color:var(--text);">-</span></div>
</div>
<script>
function hhmm(m){return Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':'');}
function calcWt(){
 var a=document.getElementById('wtIn').value, b=document.getElementById('wtOut').value, br=parseInt(document.getElementById('wtBreak').value,10)||0;
 var d=parseInt(document.getElementById('wtDays').value,10)||0, w=parseFloat(document.getElementById('wtWage').value);
 if(!a||!b) return alert('출근·퇴근 시각을 입력해주세요.');
 var pa=a.split(':'), pb=b.split(':'), s=+pa[0]*60+ +pa[1], e=+pb[0]*60+ +pb[1]; if(e<=s) e+=1440;
 var m=e-s-br; if(m<=0) return alert('휴게 시간이 근무시간보다 깁니다.');
 document.getElementById('wtDay').textContent=hhmm(m);
 document.getElementById('wtWeek').textContent=d>0?hhmm(m*d)+' ('+d+'일)':'-';
 document.getElementById('wtPay').textContent=w>0?Math.round(w*m/60).toLocaleString('ko-KR')+'원 (가산수당 제외)':'-';
 document.getElementById('result').classList.add('show');
}
</script>
</section>
<p class="at-embed-credit">계산기 제공 <a href="https://www.aroundtool.com/work_time_calculator.html?utm_source=embed&amp;utm_campaign=work_time_calculator" target="_blank" rel="noopener">어라운드툴 근무시간 계산기</a></p>
</body>
</html>
