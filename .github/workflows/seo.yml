name: SEO 자동화

# main 에 HTML 이 올라갈 때마다, 그리고 매주 월요일 아침에 실행됩니다.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "feed.xml"
  schedule:
    - cron: "17 23 * * 0"   # 매주 월요일 08:17 (한국 시간) — 구글 사이트맵 재제출
  workflow_dispatch:
    inputs:
      submit_all:
        description: "sitemap 전체 URL 을 네이버·빙에 다시 보낼까요?"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 1. sitemap lastmod 를 실제 커밋 날짜로 맞춤 ──
      - name: sitemap lastmod 갱신
        if: github.event_name != 'schedule'
        run: node scripts/update-sitemap.mjs
        env:
          SITE_HOST: ${{ vars.SITE_HOST || 'www.aroundtool.com' }}

      - name: sitemap 변경분 커밋
        if: github.event_name != 'schedule'
        run: |
          if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: sitemap lastmod 자동 갱신"
            git push
          else
            echo "· sitemap 변경 없음"
          fi

      # ── 2. 네이버·Bing 등에 바뀐 페이지 색인 요청 (IndexNow) ──
      - name: IndexNow 전송 (네이버·Bing)
        if: github.event_name != 'schedule'
        run: |
          if [[ "${{ inputs.submit_all }}" == "true" ]]; then
            node scripts/indexnow.mjs --all | tee -a _seo.log
          else
            node scripts/indexnow.mjs | tee -a _seo.log
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_HOST: ${{ vars.SITE_HOST || 'www.aroundtool.com' }}
          BEFORE_SHA: ${{ github.event.before }}

      # ── 3. 구글 서치콘솔에 사이트맵 제출 (설정한 경우에만) ──
      # 구글 키 없는 인증 (Workload Identity) — Variables 에 GCP_WIF_PROVIDER 가 있을 때만
      - name: 구글 인증
        id: gauth
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
      # 실패하면 실행 기록이 빨간색으로 표시되어 바로 알 수 있습니다 (네이버 전송은 이미 끝난 뒤).
      - name: 구글 서치콘솔 사이트맵 제출
        run: |
          set -o pipefail
          node scripts/gsc-sitemap.mjs 2>&1 | tee -a _seo.log
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          SITE_HOST: ${{ vars.SITE_HOST || 'www.aroundtool.com' }}

      # ── 4. 실행 결과를 seo-log 브랜치에 남김 (나중에 확인용) ──
      - name: 결과 기록
        if: always()
        run: |
          [ -f _seo.log ] || exit 0
          cp _seo.log /tmp/seo.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin seo-log && git checkout -q -B seo-log FETCH_HEAD || git checkout -q --orphan seo-log
          git rm -rq --cached . 2>/dev/null || true
          { echo "== $(date -u +%FT%TZ) ${{ github.event_name }} ${{ github.sha }}"; cat /tmp/seo.log; echo; } > /tmp/new.log
          [ -f seo.log ] && tail -n 400 seo.log >> /tmp/new.log
          mv /tmp/new.log seo.log
          git add -f seo.log
          git commit -qm "SEO 실행 기록 [skip ci]"
          git push -q -f origin seo-log
