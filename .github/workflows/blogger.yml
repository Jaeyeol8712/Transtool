name: 구글 블로그 게시
on:
  push:
    branches: [blog-queue]
    paths: ["queue/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: blogger
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 대기 글 올리기
        run: python3 post.py
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
      - name: 결과 기록
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted && git commit -qm "블로그 게시 기록 [skip ci]" && git push -q || echo "기록할 것 없음"
