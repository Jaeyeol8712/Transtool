name: 키워드 월간 검색수

# scripts/kw_queue.txt 가 바뀌면 네이버 검색광고 API로 월간 검색수(PC·모바일)를 조회해 keyword-data 브랜치에 저장합니다.
on:
  push:
    branches: [main]
    paths: ["scripts/kw_queue.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 조회
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
        run: python3 scripts/keyword_volume.py
      - name: 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B keyword-data
          git add -f _kw
          git commit -qm "키워드 검색수 [skip ci]"
          git push -f origin keyword-data
