<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>짹의 운영실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="office3d.js?v=5"></script>
<style>
:root{
  --bg:#eef1ec; --panel:#ffffff; --fg:#22261f; --muted:#6c7268; --line:#e2e3dc;
  --run:#1f9d55; --think:#2f6fd6; --turn:#e3a008; --err:#d43b2f; --idle:#8a8f87; --turn-soft:#fdf3d8; --accent:#0d7a6f;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a17;--panel:#202420;--fg:#e8ebe4;--muted:#a1a79d;--line:#353a33;--turn-soft:#3a3016;--accent:#5fc7b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a17;--panel:#202420;--fg:#e8ebe4;--muted:#a1a79d;--line:#353a33;--turn-soft:#3a3016;--accent:#5fc7b8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:600px}
.stage{position:relative;min-width:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow:hidden;isolation:isolate;z-index:0}
.top,.legend,.order-btn{z-index:3}
#scene{position:absolute;inset:0}
.top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;right:16px;font-size:12.5px;color:var(--muted);pointer-events:none;display:grid;gap:2px;z-index:2}
.top b{color:var(--fg);font-size:16px}
.kpi{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;pointer-events:auto}
.kpi span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg);font-size:12.5px}
.kpi b{font:500 12.5px var(--mono);font-size:12.5px}
.up{color:var(--run)}.down{color:var(--err)}
.ctl{position:absolute;right:16px;top:12px;display:flex;gap:6px;z-index:2}
.ctl button,.tabs button{font:500 13px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;cursor:pointer}
.ctl button{width:34px;padding:6px 0}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;display:flex;flex-wrap:wrap;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;z-index:2}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.o3-l{position:absolute;left:0;top:0;white-space:nowrap;font:500 11.5px var(--sans);will-change:transform}
.o3-tag{background:rgba(30,33,30,.82);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
.o3-room{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 9px;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.o3-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);margin-right:6px}
.o3-room.s-run .o3-dot{background:var(--run)}.o3-room.s-think .o3-dot{background:var(--think)}.o3-room.s-turn .o3-dot{background:var(--turn)}.o3-room.s-err .o3-dot{background:var(--err)}
.o3-badge .o3-b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--idle);color:#fff;font:700 10px var(--sans);font-style:normal;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.o3-badge.s-run .o3-b{background:var(--run)}.o3-badge.s-think .o3-b{background:var(--think)}.o3-badge.s-turn .o3-b{background:var(--turn)}.o3-badge.s-err .o3-b{background:var(--err)}
.o3-bub{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.m-hint{display:none}@media (max-width:900px){.m-hint{display:inline}}
.zoom{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:6px}
.zoom button{font:700 15px var(--sans);min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.zoom button#zAll{font-size:12.5px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.pop{position:absolute;z-index:5;width:320px;max-width:calc(100% - 32px);max-height:70%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.pop h3{margin:0 0 2px;font-size:15px}.pop .sub{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.pop dl{display:grid;grid-template-columns:68px 1fr;gap:6px 10px;margin:0;font-size:13px}.pop dt{color:var(--muted)}.pop dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pop ul{margin:0;padding-left:16px}.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.pill{display:inline-flex;font-weight:500;font-size:12.5px;border-radius:999px;padding:1px 9px}
.p-run{background:color-mix(in srgb,var(--run) 15%,transparent);color:var(--run)}.p-think{background:color-mix(in srgb,var(--think) 15%,transparent);color:var(--think)}
.p-turn{background:color-mix(in srgb,var(--turn) 18%,transparent);color:var(--turn)}.p-err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}.p-idle{background:color-mix(in srgb,var(--idle) 15%,transparent);color:var(--idle)}
/* 아래(PC는 오른쪽) 패널: 남색 대시보드 — 숫자 카드 → 알림 줄 → 빠른 실행 → 선택한 목록 */
aside{--d-bg:#0f1a2b;--d-card:#16243a;--d-card2:#1b2b44;--d-line:#25385a;--d-fg:#e8eef8;--d-muted:#90a3bf;--d-green:#1f9d6a;
  --c-amber:#e8b13a;--c-teal:#2bb3a3;--c-blue:#4c8dff;--c-green:#3fbf7f;--c-violet:#9b7cf0;--c-rose:#e46b7d;
  background:var(--d-bg);color:var(--d-fg);border-left:1px solid var(--d-line);display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;overflow:auto;padding:16px 14px 0;color-scheme:dark}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--d-line)}
.dh small{display:block;color:var(--c-blue);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.dh h2{margin:2px 0 0;font-size:19px}
.dh .badge{font-size:11.5px;color:var(--d-muted);border:1px solid var(--d-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--d-card);border:1px solid var(--d-line);border-top:2px solid var(--cc);border-radius:10px;padding:10px 12px;min-width:0;display:grid;gap:2px}
.card:hover{background:var(--d-card2)}
.card span{font-size:12px;color:var(--d-muted);font-weight:500}
.card b{font:700 22px/1.25 var(--mono);font-variant-numeric:tabular-nums;color:var(--d-fg)}
.card em{font-style:normal;font-size:11.5px;color:var(--d-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .up{color:var(--c-green)}.card .down{color:var(--c-rose)}
.alerts{background:var(--d-card);border:1px solid var(--d-line);border-radius:10px;overflow:hidden}
.al{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-bottom:1px solid var(--d-line);font-size:13px}
.al:last-child{border-bottom:0}
.al i,.li i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.al p{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al button{font:500 11.5px var(--sans);color:var(--d-fg);background:var(--d-card2);border:1px solid var(--d-line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.quick{background:var(--d-card);border:1px solid var(--d-line);border-radius:10px;padding:12px}
.quick h3,.detail h3{margin:0 0 10px;font-size:14px}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.qgrid button,.qgrid a{font:500 12.5px var(--sans);color:var(--d-fg);background:var(--d-card2);border:1px solid var(--d-line);border-radius:7px;padding:9px 6px;cursor:pointer;text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qgrid button[aria-selected="true"]{background:var(--d-green);border-color:var(--d-green);color:#fff;font-weight:700}
.qnote{margin:8px 0 0;font-size:11.5px;color:var(--d-muted)}
.detail{display:grid;gap:0}
.tab{display:grid;gap:6px;align-content:start}
.li{background:var(--d-card);border:1px solid var(--d-line);border-radius:9px;padding:10px 12px;display:grid;grid-template-columns:7px minmax(0,1fr);gap:4px 10px;align-items:start;min-width:0}
.li i{margin-top:7px}
.li .t{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.li .m{grid-column:2;color:var(--d-muted);font-size:12px;display:flex;flex-wrap:wrap;gap:3px 10px;overflow-wrap:anywhere}
.sec{font-size:12px;color:var(--d-muted);margin:8px 0 2px;font-weight:700}
.brief{display:grid;gap:6px}.brief div{background:var(--d-card);border:1px solid var(--d-line);border-left:3px solid var(--cc);border-radius:9px;padding:8px 12px;font-size:13px}.brief b{display:block;font-size:12px;color:var(--d-muted);margin-bottom:2px}
.tag{font:500 11px var(--sans);border-radius:999px;padding:1px 8px;background:color-mix(in srgb,var(--cc) 20%,transparent);color:var(--cc);white-space:nowrap}
.empty{color:var(--d-muted);text-align:center;padding:22px 8px;border:1px dashed var(--d-line);border-radius:10px;font-size:13px}
.foot{margin:0 -14px;padding:12px 14px;border-top:1px solid var(--d-line);color:var(--d-muted);font-size:12px;margin-top:auto}
.foot a{color:var(--c-teal)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){.scroller{overflow:hidden}#scene{position:relative;inset:auto;width:1140px;height:860px;transform:scale(var(--s,0.34));transform-origin:0 0}.stage{height:auto!important;display:flex;flex-direction:column;overflow:visible}.top{position:static;order:-1;padding:12px 16px 8px;pointer-events:auto}.scroller{position:relative;inset:auto;height:calc(860px * var(--s,0.34));flex:none}.legend{position:static;margin:8px 16px 12px;border-radius:12px;align-self:flex-start}.order-btn{display:none}}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}aside{border-left:0;border-top:1px solid var(--d-line);overflow:visible;padding-top:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top{right:16px;top:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="scroller" id="scroller"><div class="zoom" role="group" aria-label="확대·축소"><button id="zIn" aria-label="확대">＋</button><button id="zOut" aria-label="축소">－</button><button id="zAll" aria-label="전체 보기">전체</button></div><div id="scene" role="img" aria-label="어라운드툴 팀 사무실 3D 지도. 방과 직원을 누르면 상세가 열립니다."><div class="loading">사무실을 불러오는 중…</div></div></div>
    <div class="top"><b>짹의 운영실</b><span id="stamp">불러오는 중…</span><span>방이나 직원을 누르면 상세가 열립니다</span><div class="kpi" id="kpi"></div></div>
    
    <div class="legend"><span><i style="background:var(--run)"></i>오늘 할 일</span><span><i style="background:var(--think)"></i>공부 순번</span><span><i style="background:var(--turn)"></i>대표님 차례</span><span><i style="background:var(--err)"></i>오류</span><span><i style="background:var(--idle)"></i>대기</span></div>
    <div class="pop" id="pop" hidden></div>
  </div>
  <aside aria-label="운영 현황">
    <div class="dh"><div><small>대시보드</small><h2>전체 현황</h2></div><span class="badge" id="upd">불러오는 중</span></div>
    <div class="cards" id="cards"></div>
    <div class="alerts" id="alerts" aria-label="확인할 것"></div>
    <section class="quick"><h3>빠른 실행</h3>
      <div class="qgrid" role="tablist">
        <button role="tab" data-t="turn" aria-selected="true">대표님 차례</button>
        <button role="tab" data-t="meet" aria-selected="false">오늘 회의</button>
        <button role="tab" data-t="done" aria-selected="false">지시·완료</button>
        <button role="tab" data-t="act" aria-selected="false">최근 활동</button>
        <button role="tab" data-t="sched" aria-selected="false">예약 작업</button>
        <a href="https://claude.ai/artifact/LACgvg6UQv4JxfKsbmyf4M" target="_blank" rel="noopener">실시간 오피스 ↗</a>
      </div>
      <p class="qnote">버튼을 누르면 아래 목록이 바뀝니다. 지시는 실시간 오피스에서 보낼 수 있습니다.</p>
    </section>
    <section class="detail"><h3 id="dTitle">대표님 차례</h3><div class="tab" id="tab" role="tabpanel"></div></section>
    <div class="foot">매일 아침 회의(08:35)가 끝나면 갱신됩니다.</div>
  </aside>
</div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SCHED=[["아침 회의","매일 08:35"],["데이터 보고","매일 08:25"],["운영 점검","매일 08:12"],["블로그 게시","매일 07:43 (글은 09~21시 3시간마다)"],["컨펌 적용","컨펌하면 바로"]];
var ROOMS=[
 {id:"data",kind:"team",name:"데이터방",x:2,z:2,w:8,d:7,tint:"#bcd3ee",people:[["데이터 분석가"]]},
 {id:"ops",kind:"team",name:"운영 점검방",x:11,z:2,w:7,d:7,tint:"#efc6c6",people:[["고객만족팀"],["인스타 기획자"]]},
 {id:"meet",kind:"meet",name:"회의실 · 총괄",x:19.5,z:2,w:9,d:8,tint:"#e6dfcf",people:[["총괄"]]},
 {id:"dev",kind:"team",name:"개발방",x:30,z:2,w:8,d:7,tint:"#d5c9ee",people:[["사이트 개발"],["디자이너"]]},
 {id:"blog",kind:"team",name:"블로그방",x:2,z:11,w:8,d:6,tint:"#f5d3b0",people:[["블로그 담당"]]},
 {id:"sched",kind:"sched",name:"예약 작업실",x:11,z:11,w:7,d:6,tint:"#dfe3e6",people:SCHED.map(function(s){return[s[0],s[1]]})},
 {id:"boss",kind:"boss",name:"대표실",x:19.5,z:12,w:9,d:7,tint:"#c9a27a",people:[["대표님"]]},
 {id:"content",kind:"team",name:"콘텐츠방",x:30,z:11,w:8,d:8,tint:"#efe2a8",people:[["기획자"],["콘텐츠 작성자"],["검수·신뢰"]]},
 {id:"seo",kind:"team",name:"검색·광고방",x:2,z:19.5,w:12,d:8,tint:"#c8e4d0",people:[["검색 노출"],["광고"],["카페 담당"],["커뮤니티 관리자"]]},
 {id:"lounge",kind:"lounge",name:"라운지 · 탕비실",x:15.5,z:21,w:7,d:7,tint:"#eee8dc",people:[]},
 {id:"law",kind:"team",name:"법무·재무방",x:24,z:21,w:14,d:7,tint:"#e0dbd0",people:[["법무팀"],["재무 담당"],["상품 개발팀"],["AI 개발팀"]]}
];
var ORDER=["총괄","검색 노출","사이트 개발","기획자","디자이너","콘텐츠 작성자","데이터 분석가","검수","신뢰","광고","카페 담당","인스타 기획자","커뮤니티 관리자","법무팀","상품 개발팀","재무 담당","AI 개발팀","고객만족팀"];
function kst(){var d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)}
function focus(){var t=kst(),day=Math.floor((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(2026,9,28))/864e5);var f=ORDER[((day%ORDER.length)+ORDER.length)%ORDER.length];return f==="검수"||f==="신뢰"?"검수·신뢰":f}
var D=null,OFF=null,tab="turn";
function team(n){return D&&D.teams.filter(function(t){return t.name===n})[0]}
function quiet(t){return !t||!t.today||/변동 없음/.test(t.today)}
function stOf(r,p){
  if(r.id==="boss")return D&&D.todo.some(function(x){return x.who==="대표"})?"turn":"idle";
  if(r.kind==="sched")return "idle";
  if(p[0]===focus())return "think";
  var t=team(p[0]);if(p[0]==="블로그 담당")return "run";
  return quiet(t)?"idle":"run";
}
function roomSt(r){if(!r.people.length)return"idle";var s=r.people.map(function(p){return stOf(r,p)});return s.indexOf("turn")>=0?"turn":s.indexOf("run")>=0?"run":s.indexOf("think")>=0?"think":"idle"}
function short(s,n){s=String(s||"");return s.length>n?s.slice(0,n)+"…":s}
function refresh(){
  if(!OFF||!D)return;
  ROOMS.forEach(function(r){OFF.setRoom(r.id,roomSt(r));r.people.forEach(function(p,i){var st=stOf(r,p);OFF.setStatus(r.id,i,st);
    var t=team(p[0]),b=null;
    if(r.kind==="sched")b=i===0?"예약 작업 "+SCHED.length+"건":null;
    else if(r.id==="boss"){var n=D.todo.filter(function(x){return x.who==="대표"}).length;b=n?"확인할 일 "+n+"건":null}
    else if(p[0]===focus())b="오늘 공부 순번이에요";
    else if(i===0&&t&&!quiet(t))b=short(t.today,22);
    OFF.setBubble(r.id,i,b)})});
}
function pct(a,b){if(!b)return"";var v=Math.round((a-b)/b*100);return '<b class="'+(v>=0?"up":"down")+'">'+(v>=0?"+":"")+v+'%</b>'}
function head(){
  var k=D.kpi||{},c=k.cur||{},p=k.prev||{};
  $("#stamp").textContent=(D.updated||"")+" 갱신 · "+(k.range||"")+" · 오늘 공부 순번: "+focus();
  $("#kpi").innerHTML=k.cur?'<span>사용자 <b>'+c.users+'</b> '+pct(c.users,p.users)+'</span><span>방문 <b>'+c.sessions+'</b> '+pct(c.sessions,p.sessions)+'</span><span>조회 <b>'+c.views+'</b> '+pct(c.views,p.views)+'</span>'+(k.organic?'<span>오가닉 <b>'+k.organic.cur+'</b> '+pct(k.organic.cur,k.organic.prev)+'</span>':""):"";
}
function showPop(r,p,x,y){
  var rows=[],st=p?stOf(r,p):roomSt(r),T={run:"오늘 할 일",think:"공부 순번",turn:"대표님 차례",err:"오류",idle:"대기"};
  rows.push(["상태",'<span class="pill p-'+st+'">'+T[st]+'</span>']);
  if(p&&r.kind==="sched")rows.push(["일정",esc(p[1])]);
  var t=p&&team(p[0]);
  if(t){if(t.mission)rows.push(["하는 일",esc(t.mission)]);if(t.today)rows.push(["오늘",esc(t.today)]);if(t.todo)rows.push(["해야 할 일",esc(t.todo)]);if(t.basis)rows.push(["근거",esc(t.basis)]);
    if(t.kpi&&t.kpi.length)rows.push(["KPI","<ul>"+t.kpi.map(function(k){return"<li>"+esc(k.name)+" · 목표 "+esc(k.target)+(k.now?" · 지금 "+esc(k.now):"")+"</li>"}).join("")+"</ul>"]);
    if(t.learn&&t.learn.length)rows.push(["최근 공부",esc(t.learn[0])]);}
  if(r.id==="boss")rows.push(["확인할 일",D.todo.filter(function(x){return x.who==="대표"}).length+"건 (‘대표님 차례’ 카드)"]);
  if(!p&&r.people.length)rows.push(["사람",esc(r.people.map(function(q){return q[0]}).join(" · "))]);
  if(r.kind==="lounge")rows.push(["설명","쉬는 곳입니다. 돌아다니는 직원은 복도를 오가는 중이에요."]);
  var pop=$("#pop");pop.innerHTML='<button class="x" aria-label="닫기">×</button><h3>'+esc(p?p[0]:r.name)+'</h3><div class="sub">'+esc(p?r.name:"")+'</div><dl>'+rows.map(function(a){return"<dt>"+a[0]+"</dt><dd>"+a[1]+"</dd>"}).join("")+"</dl>";
  pop.hidden=false;var sw=$("#stage").clientWidth,sh=$("#stage").clientHeight;pop.style.left=Math.max(16,Math.min(sw-336,x+12))+"px";pop.style.top=Math.max(16,Math.min(sh-pop.offsetHeight-16,y-20))+"px";
  pop.querySelector(".x").onclick=function(){pop.hidden=true};
}
var TABS={turn:"대표님 차례",meet:"오늘 회의",done:"지시·완료",act:"최근 활동",sched:"예약 작업"};
function dl(a,b){if(a==null||!b)return"";var v=Math.round((a-b)/b*100);return '<span class="'+(v>=0?"up":"down")+'">'+(v>=0?"+":"")+v+'%</span>'}
function li(cc,t,m){return '<div class="li" style="--cc:var(--c-'+cc+')"><i></i><div class="t">'+t+'</div>'+(m?'<div class="m">'+m+'</div>':"")+'</div>'}
function dash(){
  var me=D.todo.filter(function(x){return x.who==="대표"}),tm=D.todo.filter(function(x){return x.who!=="대표"}),os=D.orders||[],
      od=os.filter(function(o){return o.status==="done"}).length,k=D.kpi||{},c=k.cur||{},p=k.prev||{},g=k.organic;
  $("#upd").textContent=(D.updated||"")+" 갱신";
  var C=[["대표님 차례",me.length+"건","확인하고 정해 주실 일","amber","turn"],
    ["팀 진행 중",tm.length+"건","각 팀이 맡아 처리 중","teal","turn"],
    ["지시 처리",od+" / "+os.length,"완료 / 전체 지시","blue","done"],
    ["주간 사용자",c.users!=null?c.users:"–",dl(c.users,p.users)+" 지난주 "+(p.users!=null?p.users:"–"),"green","act"],
    ["검색 유입",g?g.cur:"–",g?dl(g.cur,g.prev)+" 지난주 "+g.prev:"","violet","act"],
    ["예약 작업",SCHED.length+"개","매일 정해진 시각에 실행","rose","sched"]];
  $("#cards").innerHTML=C.map(function(x){return '<button class="card" data-go="'+x[4]+'" style="--cc:var(--c-'+x[3]+')"><span>'+x[0]+'</span><b>'+x[1]+'</b><em>'+x[2]+'</em></button>'}).join("");
  var A=me.slice(0,4).map(function(x){return["amber",esc(x.text),"확인","turn"]});
  var m=D.meetings&&D.meetings[0];if(m&&m.brief&&m.brief.improve)A.push(["blue","다음 할 일 — "+esc(m.brief.improve),"회의록","meet"]);
  var ing=os.filter(function(o){return o.status==="ing"})[0];if(ing)A.push(["teal","진행 중 지시 — "+esc(ing.title),"지시","done"]);
  if(me.length>4)A.splice(4,0,["amber","그 밖에 확인할 일 "+(me.length-4)+"건","전체","turn"]);
  $("#alerts").innerHTML=A.map(function(a){return '<div class="al" style="--cc:var(--c-'+a[0]+')"><i></i><p>'+a[1]+'</p><button data-go="'+a[3]+'">'+a[2]+'</button></div>'}).join("");
}
function go(t){tab=t;document.querySelectorAll(".qgrid button").forEach(function(x){x.setAttribute("aria-selected",x.dataset.t===t)});render()}
function render(){
  var el=$("#tab"),h="";$("#dTitle").textContent=TABS[tab];
  if(!D){el.innerHTML='<div class="empty">불러오는 중…</div>';return}
  dash();
  if(tab==="turn"){var L=D.todo.filter(function(x){return x.who==="대표"});
    h=L.length?L.map(function(x){return li("amber",esc(x.text),"<span>"+esc(x.since||"")+"부터</span>")}).join(""):'<div class="empty">지금은 확인할 일이 없어요 🎉</div>';
    var O=D.todo.filter(function(x){return x.who!=="대표"});if(O.length)h+='<div class="sec">팀이 하는 중 · '+O.length+'건</div>'+O.map(function(x){return li("teal",esc(x.text),"<span>"+esc(x.who)+"</span><span>"+esc(x.since||"")+"</span>")}).join("")}
  else if(tab==="meet"){var m=D.meetings&&D.meetings[0];h=m?li("blue",esc(m.title),"<span>"+esc(m.date)+"</span>")+'<div class="brief">'+[["핵심 결론","conclusion","blue"],["문제점","problem","rose"],["개선 방향","improve","amber"],["긍정 요소","positive","green"]].map(function(a){return m.brief&&m.brief[a[1]]?'<div style="--cc:var(--c-'+a[2]+')"><b>'+a[0]+"</b>"+esc(m.brief[a[1]])+"</div>":""}).join("")+"</div>"+((m.roles||[]).length?'<div class="sec">팀별 발언</div>':"")+(m.roles||[]).map(function(r){return li("violet",esc(r.say),"<span>"+esc(r.role)+"</span>")}).join(""):'<div class="empty">회의 기록이 없습니다.</div>'}
  else if(tab==="done"){h=(D.orders||[]).map(function(o){var cc=o.status==="done"?"green":o.status==="ing"?"blue":"amber";return li(cc,esc(o.title),'<span class="tag" style="--cc:var(--c-'+cc+')">'+(o.status==="done"?"완료":o.status==="ing"?"진행 중":esc(o.status||""))+"</span><span>"+esc(o.date)+"</span>"+(o.note?"<span>"+esc(o.note)+"</span>":""))}).join("")||'<div class="empty">지시 기록이 없습니다.</div>'}
  else if(tab==="act"){h=((D.today||[]).length?'<div class="sec">오늘</div>':"")+(D.today||[]).map(function(x){return li("teal",esc(x),"")}).join("")+((D.days||[]).length?'<div class="sec">지난 기록</div>':"")+(D.days||[]).slice(0,14).map(function(x){return li("blue",esc(x.text),"<span>"+esc(x.label)+"</span>")}).join("")}
  else{h=SCHED.map(function(s){return li("rose",esc(s[0]),"<span>"+esc(s[1])+"</span>")}).join("")}
  el.innerHTML=h;
}
document.querySelector("aside").addEventListener("click",function(e){var b=e.target.closest("[data-t],[data-go]");if(!b||b.tagName==="A")return;go(b.dataset.t||b.dataset.go);if(b.dataset.go)$(".detail").scrollIntoView({behavior:"smooth",block:"start"})});
function init(){
  var host=$("#scene");
  if(!window.THREE||!window.createOffice){host.querySelector(".loading").textContent="3D 화면을 불러오지 못했습니다. 새로고침해 주세요.";return}
  host.innerHTML="";
  OFF=createOffice(host,{rooms:ROOMS.map(function(r){return Object.assign({},r,{people:r.people.map(function(p){return{name:p[0]}})})}),
    onPick:function(h,e){if(!h){$("#pop").hidden=true;return}var rc=$("#stage").getBoundingClientRect(),r=ROOMS.filter(function(x){return x.id===h.room.id})[0];showPop(r,h.idx!=null?r.people[h.idx]:null,e.clientX-rc.left,e.clientY-rc.top)}});
    refresh();
}
render();init();document.getElementById("zIn").onclick=function(){OFF&&OFF.zoomBy(1.35)};document.getElementById("zOut").onclick=function(){OFF&&OFF.zoomBy(1/1.35)};document.getElementById("zAll").onclick=function(){OFF&&OFF.zoomReset()};(function(){function fit(){var sc=document.getElementById("scroller");if(!sc)return;var w=sc.clientWidth||window.innerWidth;document.documentElement.style.setProperty("--s",Math.min(1,w/1140).toFixed(4));}fit();window.addEventListener("resize",fit);})();
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){D=d;head();render();refresh()}).catch(function(){$("#stamp").textContent="데이터를 불러오지 못했습니다."});
setInterval(function(){if(D){head();refresh()}},60000);
})();
</script>
</body>
