<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>짹의 운영실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#DCE6E1; --floor-line:#C9D7D0; --wall:#2E4A47; --wall-2:#365855;
  --wood:#8A5A3B; --wood-top:#A8714C; --ink:#17201E; --ink-2:#4A5754; --ink-3:#6E7B77;
  --paper:#FFFFFF; --page:#EEF3F0; --line:#CAD6D1;
  --chief:#0B6E5F; --writer:#D93B3B; --analyst:#2A6FD6; --designer:#D98A00; --dev:#6A4FD0; --insta:#C2367A; --boss:#17201E;
  --seo:#3D7A1F; --plan:#9C4F96; --qa:#5B6770; --ads:#C2410C; --cafe:#0A7F8F; --community:#7A5C2E; --up:#0B6E5F; --down:#C93434;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --floor:#1F2B28; --floor-line:#28362F; --wall:#122220; --wall-2:#18302C;
  --wood:#6B4329; --wood-top:#83553A; --ink:#EEF3F0; --ink-2:#BFCBC6; --ink-3:#93A19C;
  --paper:#1A2422; --page:#121A18; --line:#2C3B37; color-scheme:dark}}
:root[data-theme="dark"]{--floor:#1F2B28;--floor-line:#28362F;--wall:#122220;--wall-2:#18302C;--wood:#6B4329;--wood-top:#83553A;--ink:#EEF3F0;--ink-2:#BFCBC6;--ink-3:#93A19C;--paper:#1A2422;--page:#121A18;--line:#2C3B37;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:16px/1.65 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{max-width:1240px;margin:0 auto;padding:28px 16px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.1;margin:0 0 .35rem;letter-spacing:-.01em}
.top p{margin:0;color:var(--ink-2);max-width:34rem}
.clock{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.9rem}

/* 무대 */
.stage-wrap{max-width:1240px;margin:16px auto 0;padding:0 16px;display:grid;gap:16px}
@media(min-width:1000px){.stage-wrap{grid-template-columns:1fr 300px}}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--floor);box-shadow:0 1px 0 var(--line)}
.stage svg{display:block;width:100%;height:auto}
.log{background:var(--paper);border-radius:18px;padding:14px 14px 6px;display:flex;flex-direction:column;min-height:260px;max-height:640px}
.log h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.15rem;margin:0 0 8px}
.log ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:10px 1fr;gap:8px;font-size:.88rem;line-height:1.45;animation:pop .35s ease-out}
.log li i{width:10px;height:10px;border-radius:50%;margin-top:.4em}
.log li b{font-weight:700;margin-right:4px}
.log li span{color:var(--ink-2)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctl{display:flex;gap:8px;margin:8px 0}
.ctl button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.ctl button:focus-visible{outline:2px solid var(--chief);outline-offset:2px}

/* SVG 요소 */
.name{font:700 13px "IBM Plex Sans KR",sans-serif;fill:#fff}
.small{font:500 11px "IBM Plex Sans KR",sans-serif;fill:var(--ink-3)}
.wall-t{font-family:"Black Han Sans",sans-serif;font-size:22px;fill:#E8F1EE}
.bub rect{fill:var(--paper);stroke:var(--line)}
.bub text{font:500 14px "IBM Plex Sans KR",sans-serif;fill:var(--ink)}
.bub{opacity:0;transition:opacity .25s ease}
.bub.on{opacity:1}
.person{transform-box:fill-box;transform-origin:50% 100%}
.person.busy{animation:bob .5s ease-in-out infinite alternate}
.person.busy .arm{animation:type .18s linear infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
@keyframes type{to{transform:translateY(-3px)}}
.panel{opacity:.35;transition:opacity .3s}
.panel.on{opacity:1}
.ticket text{font:700 11px "IBM Plex Sans KR",sans-serif;fill:#fff}
.glow{opacity:0;transition:opacity .3s}
.glow.on{opacity:.22}
@media (prefers-reduced-motion:reduce){.person.busy,.person.busy .arm{animation:none}.log li{animation:none}}

/* 아래 내용 */
.sec{max-width:1240px;margin:48px auto 0;padding:0 16px}
.sec h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0 0 4px}
.sec>p{margin:0 0 18px;color:var(--ink-2);max-width:42rem}
.team{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.member{background:var(--paper);border-radius:16px;padding:16px 16px 14px;border-top:6px solid var(--c)}
.member h3{margin:0;font-size:1.1rem}
.member .role{color:var(--ink-3);font-size:.85rem;margin:0 0 10px}
.member ul{margin:0;padding-left:1.1em;font-size:.9rem;color:var(--ink-2)}
.member .num{display:flex;gap:16px;margin:12px 0 0;font-size:.82rem;color:var(--ink-3)}
.member .num b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.5rem;color:var(--ink);line-height:1.1}
.member.soon{background:transparent;border:2px dashed var(--line);border-top:6px solid var(--c)}
.flow{background:var(--paper);border-radius:16px;padding:18px;display:grid;gap:10px}
@media(min-width:800px){.flow{grid-template-columns:repeat(5,1fr)}}
.flow div{font-size:.9rem;color:var(--ink-2)}
.flow b{display:block;color:var(--ink);font-size:1rem;margin-bottom:2px}
.days{list-style:none;margin:0;padding:0;border-left:3px solid var(--line)}
.days li{position:relative;padding:0 0 18px 20px}
.days li::before{content:"";position:absolute;left:-8px;top:.45em;width:13px;height:13px;border-radius:50%;background:var(--page);border:3px solid var(--chief)}
.days time{font-weight:700}
.days p{margin:2px 0 0;color:var(--ink-2);font-size:.92rem}
/* 픽셀 사무실 */
.stage{align-self:start;background:#E8DCC6;padding:10px;display:flex;flex-direction:column;gap:8px}
.stage-scroll{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
#office{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:12px}
.stage .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
.stage .ctl button{font:inherit;font-size:.85rem;border:1px solid #CDBFA6;background:#FFF8EC;color:#17201E;border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}
.hint{font-size:.85rem;color:#5B4A35}
.crew{background:var(--paper);border-radius:18px;padding:12px;align-self:start}
.crew h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.15rem;margin:0 0 8px}
.crew ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 6px}
@media(min-width:1000px){.crew ul{grid-template-columns:1fr}}
.crew button{display:grid;grid-template-columns:10px 1fr;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-radius:10px;padding:5px 6px;cursor:pointer;min-height:44px}
.crew button:hover,.crew button:focus-visible{background:var(--page);outline:none}
.crew i{width:10px;height:10px;border-radius:3px;margin-top:.4em}
.crew b{font-size:.88rem;margin-right:6px}
@media(max-width:999px){.crew b,.crew small{display:block!important}.crew em{display:none!important}.crew button{padding:6px}}
.crew small{font-size:.8rem;color:var(--ink-2)}
.crew em{display:block;font-style:normal;font-size:.72rem;color:var(--ink-3)}
@media(min-width:1000px){.stage-wrap{grid-template-columns:1fr 250px}}
/* 아래 정리 */
.brief{margin:0;padding:16px 16px 16px 34px;background:var(--paper);border-radius:16px;display:flex;flex-direction:column;gap:6px}
.work{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.wk{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--paper);border:0;border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:44px}
.wk b{font-size:1rem}.wk span{font-size:.88rem;color:var(--ink-2)}
.wk:hover,.wk:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.done{margin:0;padding:16px 16px 16px 34px;background:var(--paper);border-radius:16px;display:flex;flex-direction:column;gap:6px}
.kpi-note{margin:0 0 12px;color:var(--ink-2)}
.kpit{background:var(--paper);border-radius:16px;padding:6px 12px}
.kpit table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.kpit th{text-align:left;font-weight:500;color:var(--ink-3);font-size:.8rem;padding:10px 8px}
.kpit td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.kpit td.tm{font-weight:700;white-space:nowrap}
.kpit td.now{font-weight:700}.kpit td.none{color:var(--ink-3)}
#office{cursor:pointer}
/* KPI·팀 상세 */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.kpi{background:var(--paper);border-radius:16px;padding:14px 16px}
.kpi span{display:block;font-size:.82rem;color:var(--ink-3)}
.kpi b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{font-size:.8rem;color:var(--ink-3)}
.kpi .u{color:var(--up);font-weight:700}.kpi .d{color:var(--down);font-weight:700}
.spark{background:var(--paper);border-radius:16px;padding:14px 16px;margin-top:12px}
.spark svg{display:block;width:100%;height:120px}
.member{cursor:pointer;text-align:left;font:inherit;color:inherit;border:0;width:100%}
.member:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.member .more{margin-top:10px;font-size:.82rem;font-weight:700;color:var(--c)}
dialog.rr{border:0;border-radius:20px;padding:0;max-width:720px;width:calc(100% - 32px);background:var(--paper);color:var(--ink)}
dialog.rr::backdrop{background:rgba(10,20,18,.55)}
.rr-in{padding:22px 22px 18px;border-top:8px solid var(--c)}
.rr h3{margin:0;font-size:1.4rem}.rr .sub{margin:2px 0 14px;color:var(--ink-3);font-size:.9rem}
.rr h4{margin:16px 0 6px;font-size:1rem}
.rr ul{margin:0;padding-left:1.1em;font-size:.93rem}
.rr table{width:100%;border-collapse:collapse;font-size:.88rem}
.rr th,.rr td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.rr th{color:var(--ink-3);font-weight:500;font-size:.8rem}
.rr .x{float:right;font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.meet{background:var(--paper);border-radius:16px;padding:16px}
.meet table{width:100%;border-collapse:collapse;font-size:.9rem}
.meet td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.meet td:first-child{white-space:nowrap;font-weight:700;width:1%}
.orders{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.orders li{background:var(--paper);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline}
.orders time{font-size:.82rem;color:var(--ink-3);white-space:nowrap}
.orders .st{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--page);white-space:nowrap}
.orders .st.done{color:var(--chief)}.orders .st.wait{color:var(--designer)}.orders .st.ing{color:var(--analyst)}
.orders p{grid-column:2/4;margin:0;font-size:.85rem;color:var(--ink-2)}
.wrap-x{overflow-x:auto}
footer{max-width:1240px;margin:48px auto 0;padding:18px 16px 40px;color:var(--ink-3);font-size:.82rem}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>짹의 운영실</h1>
    <p>어라운드툴을 함께 굴리는 팀입니다. 대표 짹이 총괄에게 말하면, 총괄이 맡을 사람을 정해 일을 넘기고 결과를 모아 보고합니다.</p>
  </div>
  <span class="clock" id="clock"></span>
</header>

<div class="stage-wrap">
  <div class="stage">
    <div class="stage-scroll"><canvas id="office" width="1728" height="992" role="img" aria-label="팀 12명이 각자 방에서 일하고, 회의실에 모여 회의하는 픽셀 사무실"></canvas></div>
    <div class="ctl"><button type="button" id="pause" aria-pressed="false">잠깐 멈춤</button><button type="button" id="meetNow">회의 소집</button><span class="hint" id="now">사무실 불을 켜는 중…</span></div>
  </div>
  <aside class="crew" aria-labelledby="crew-h">
    <h2 id="crew-h">구성원</h2>
    <ul id="crew"></ul>
  </aside>
</div>

<dialog class="rr" id="rr" aria-labelledby="rr-name"><div class="rr-in" id="rr-in"></div></dialog>

<section class="sec" aria-labelledby="t-meet">
  <h2 id="t-meet">오늘 회의</h2>
  <ul class="brief" id="brief"><li>불러오는 중…</li></ul>
</section>

<section class="sec" aria-labelledby="t-work">
  <h2 id="t-work">팀별 업무</h2>
  <div class="work" id="work"></div>
</section>

<section class="sec" aria-labelledby="t-done">
  <h2 id="t-done">오늘 한 일</h2>
  <ul class="done" id="done"></ul>
</section>

<section class="sec" aria-labelledby="t-kpi">
  <h2 id="t-kpi">팀별 KPI</h2>
  <p class="kpi-note" id="kpi-note"></p>
  <div class="wrap-x kpit"><table><thead><tr><th>팀</th><th>지표</th><th>현재</th><th>목표</th></tr></thead><tbody id="kpit"></tbody></table></div>
</section>

<footer>짹만 보는 페이지 · 검색 제외</footer>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var el = function (tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ───── 팀 ───── */
  var ROLES = {
    chief:    { name: '총괄', desc: '우선순위·보고',           short: '총괄',   c: '--chief',     hair: '#2B211C', skin: '#F2C9A6', item: 'shelf' },
    seo:      { name: '검색 노출', desc: '검색 순위 올리기',       short: '검색',   c: '--seo',       hair: '#1E1E1E', skin: '#EBC09A', item: 'chart' },
    plan:     { name: '기획자', desc: '새 페이지 기획',         short: '기획',   c: '--plan',      hair: '#5A3420', skin: '#F2C9A6', item: 'notes' },
    writer:   { name: '콘텐츠 작성자', desc: '글 쓰고 고치기',   short: '작성',   c: '--writer',    hair: '#3A2A22', skin: '#F4D0B0', item: 'books' },
    designer: { name: '디자이너', desc: '화면·이미지',       short: '디자인', c: '--designer',  hair: '#7A3E1C', skin: '#EBC09A', item: 'easel' },
    dev:      { name: '사이트 개발', desc: '사이트 만들기',     short: '개발',   c: '--dev',       hair: '#222222', skin: '#E8BC94', item: 'server' },
    analyst:  { name: '데이터 분석가', desc: '유입 숫자 보고',   short: '데이터', c: '--analyst',   hair: '#16161C', skin: '#F2C9A6', item: 'screen' },
    qa:       { name: '검수·신뢰', desc: '틀린 것 잡기',       short: '검수',   c: '--qa',        hair: '#4A4A4A', skin: '#EBC09A', item: 'cabinet' },
    cafe:     { name: '카페 담당', desc: '카페로 유입',       short: '카페',   c: '--cafe',      hair: '#2E2420', skin: '#F4D0B0', item: 'cafe' },
    insta:    { name: '인스타 기획자', desc: '인스타로 유입',   short: '인스타', c: '--insta',     hair: '#3A1E2A', skin: '#F2C9A6', item: 'ring' },
    community:{ name: '커뮤니티 관리자', desc: '자유글 관리', short: '커뮤',   c: '--community', hair: '#2B2B2B', skin: '#E8BC94', item: 'board' },
    ads:      { name: '광고', desc: '필요할 때 광고',           short: '광고',   c: '--ads',       hair: '#1E1E1E', skin: '#EBC09A', item: 'mega' }
  };
  var BOSS = { name: '짹 (대표)', desc: '방향 정하고 컨펌', short: '짹', c: '--boss', hair: '#111111', skin: '#F2C9A6' };
  var KEY = { '총괄': 'chief', '검색 노출': 'seo', '사이트 개발': 'dev', '기획자': 'plan', '디자이너': 'designer', '작성자': 'writer', '콘텐츠 작성자': 'writer',
    '데이터 분석가': 'analyst', '검수·신뢰': 'qa', '광고': 'ads', '카페': 'cafe', '카페 담당': 'cafe', '인스타 기획자': 'insta', '커뮤니티 관리자': 'community' };

  /* ───── 지도 (타일 16px) — 넓은 화면: 5칸×3줄(54×31), 휴대폰: 2칸×8줄(24×82) ───── */
  var NARROW = (document.querySelector('.stage') || document.body).getBoundingClientRect().width < 700;
  var T = 16, S = 2, FS = NARROW ? 1.45 : 1, W, H, RY, CY, ROOM;
  var cx = function (col) { return (2 + col * 10) * T; };
  if (!NARROW) {
    W = 54 * T; H = 31 * T; RY = [2 * T, 12 * T, 22 * T]; CY = [11 * T, 11 * T, 21 * T];
    ROOM = { chief: [0, 0], meet: [0, 1, 2], seo: [0, 3], plan: [0, 4],
      writer: [1, 0], designer: [1, 1], dev: [1, 2], analyst: [1, 3], qa: [1, 4],
      cafe: [2, 0], insta: [2, 1], community: [2, 2], ads: [2, 3], lounge: [2, 4] };
  } else {
    W = 24 * T; H = 82 * T; RY = []; CY = [];
    for (var rr = 0; rr < 8; rr++) { RY.push((2 + rr * 10) * T); CY.push((11 + rr * 10) * T); }
    ROOM = { meet: [0, 0, 2], chief: [1, 0], seo: [1, 1], plan: [2, 0], writer: [2, 1], designer: [3, 0], dev: [3, 1],
      analyst: [4, 0], qa: [4, 1], cafe: [5, 0], insta: [5, 1], community: [6, 0], ads: [6, 1], lounge: [7, 0] };
  }
  function room(id) { var r = ROOM[id]; var w = (r[2] || 1) * 10 * T; return { x: cx(r[1]), y: RY[r[0]], w: w, h: 8 * T, row: r[0], door: cx(r[1]) + w / 2, bottom: NARROW || r[0] === 0 }; }
  function seat(id) { var r = room(id); return { x: r.x + 5 * T, y: r.y + 5.4 * T }; }
  function doorIn(id) { var r = room(id); return { x: r.door, y: r.bottom ? r.y + 6.6 * T : r.y + 1.4 * T }; }
  var MEET = room('meet'), TABLE = { x: MEET.x + MEET.w / 2, y: MEET.y + 4 * T };
