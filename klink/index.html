<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K링크 K-Link</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="K링크 — 지도와 3D 거리에서 가고 싶은 곳을 저장하면 날짜별 동선과 숙소를 추천하는 한국 여행 플래너 (시연 버전)">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A2E; --ink2:#2B3350; --mute:#667089; --faint:#98A0B5; --line:#E2E6EE; --soft:#EEF1F6; --paper:#F5F7FA; --white:#fff;
  --cobalt:#2443E8; --cobalt2:#1B34C4; --cobalt-soft:#E9EDFF; --blossom:#FF4F7B; --blossom-soft:#FFE7EE;
  --amber:#B26B00; --amber-soft:#FFF3D9; --green:#0E8F5E; --green-soft:#E3F6EE; --wechat:#07C160;
  --sea:#D6E2F6; --land:#FFFFFF; --land2:#ECEFF4; --river:#BCD0F3;
  --serif:"Hahmlet",Georgia,serif; --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --sh1:0 1px 2px rgba(20,26,46,.06),0 1px 0 var(--line);
  --sh2:0 10px 30px -12px rgba(20,26,46,.28),0 0 0 1px rgba(20,26,46,.05);
  --sh3:0 24px 60px -18px rgba(20,26,46,.45);
  --appbar:56px; --tabbar:64px; --lc:#2443E8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html[lang="zh-CN"]{--sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--serif:"Hahmlet","Noto Serif SC","Songti SC",serif}
html[lang="ja"]{--sans:"IBM Plex Sans","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--serif:"Hahmlet","Noto Serif JP","Hiragino Mincho ProN",serif}
html[lang="en"]{--sans:"IBM Plex Sans",system-ui,sans-serif}
html[lang="ko"] body{word-break:keep-all}
html[lang="zh-CN"] body,html[lang="ja"] body{line-break:strict}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:8px}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.4px;line-height:1.25;text-wrap:balance}
p{text-wrap:pretty}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-rows:calc(var(--appbar) + var(--safe-t)) minmax(0,1fr) calc(var(--tabbar) + var(--safe-b));grid-template-columns:minmax(0,1fr);background:var(--paper)}
.appbar{grid-row:1;display:flex;align-items:center;gap:8px;padding:var(--safe-t) 12px 0;background:var(--white);border-bottom:1px solid var(--line);z-index:30;min-width:0;overflow:hidden}
@media (max-width:430px){.brand #brandt{display:none}.tripbtn .pp{display:none}.langs button{min-width:30px;padding:0 7px}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:-.4px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--cobalt);color:#fff;display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.appbar .sp{flex:1}
.tripbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap;min-width:0}
.tripbtn svg{width:16px;height:16px;color:var(--cobalt);flex-shrink:0}
.tripbtn span{overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.langs button{height:30px;min-width:34px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.langs button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.18)}
.main{grid-row:2;position:relative;overflow:hidden;min-height:0}
.tabbar{grid-row:3;display:flex;background:var(--white);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--cobalt)}
.tabbar .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blossom);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.stage{position:absolute;inset:0;background:var(--sea);overflow:hidden}
#mapbox,#worldbox{position:absolute;inset:0}
@media (max-width:979px){.app.t-map #worldbox{bottom:calc(var(--sheet-h,38%) - 22px);transition:bottom .32s cubic-bezier(.3,.7,.2,1)}}
.panel{position:absolute;inset:0;overflow-y:auto;background:var(--paper);-webkit-overflow-scrolling:touch}
.panel-in{max-width:640px;margin:0 auto;padding:20px 18px 40px}
.tabtop{display:none}

/* map tab on mobile: stage fills, panel becomes bottom sheet */
.app.t-map .panel{top:auto;height:var(--sheet-h,38%);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh3);background:var(--white);overflow:hidden;display:flex;flex-direction:column;transition:height .32s cubic-bezier(.3,.7,.2,1);z-index:10}
.app.t-map .panel.drag{transition:none}
.app.t-map .panel .panel-in{padding-top:4px;flex:1;overflow-y:auto;width:100%}
.grab{flex-shrink:0;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
.app:not(.t-map) .grab{display:none}
.app:not(.t-map) .stage{display:none}

@media (min-width:980px){
  .app{grid-template-rows:var(--appbar) minmax(0,1fr);grid-template-columns:440px minmax(0,1fr)}
  .appbar{grid-column:1/3}
  .main{grid-column:1/3;display:grid;grid-template-columns:440px minmax(0,1fr);min-width:0}
  .panel,.app.t-map .panel{position:relative;inset:auto;height:auto;border-radius:0;box-shadow:none;border-right:1px solid var(--line);background:var(--paper);display:block;overflow-y:auto}
  .app.t-map .panel .panel-in{padding-top:18px}
  .stage,.app:not(.t-map) .stage{position:relative;display:block;inset:auto}
  .tabbar{display:none}
  .tabtop{display:flex;gap:4px;padding:12px 18px 0;position:sticky;top:0;background:var(--paper);z-index:5}
  .tabtop button{flex:1;height:40px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
  .tabtop button svg{width:18px;height:18px}
  .tabtop button.on{background:var(--white);color:var(--ink);box-shadow:var(--sh1)}
  .tabtop .badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blossom);color:#fff;font-size:11px;display:grid;place-items:center}
  .grab{display:none}
  .app.t-map .panel{background:var(--paper)}
}

/* ---------- type & generic ---------- */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--cobalt);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.eyebrow button{color:var(--cobalt);font-weight:600}
.eyebrow .sep{color:var(--faint)}
.h1{font-size:25px;font-weight:700}
.h2{font-size:19px;font-weight:700}
.lead{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.6}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec h3{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:0}
.sec small{font-size:12px;color:var(--faint);text-align:right}
.note{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:12px}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;background:var(--cobalt);color:#fff;font-weight:600;font-size:15px;line-height:1.3;text-align:center;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ink{background:var(--ink)}
.btn.ghost{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--cobalt-soft);color:var(--cobalt)}
.btn.wechat{background:var(--wechat)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex-shrink:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--white);box-shadow:var(--sh2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,box-shadow .15s}
.chip.on{background:var(--ink);color:#fff;box-shadow:none;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .ci{width:22px;height:22px;margin-left:-6px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chip .ci svg{width:13px;height:13px}
.chip.on .ci{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.card{background:var(--white);border-radius:var(--r-md);box-shadow:var(--sh1)}
.list{background:var(--white);border-radius:var(--r-md);box-shadow:var(--sh1);overflow:hidden}
.list>*+*{border-top:1px solid var(--soft)}
.empty{text-align:center;padding:34px 16px;color:var(--mute);font-size:14px;line-height:1.65}
.empty .art{width:120px;height:90px;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-family:var(--serif)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.rsv{background:var(--blossom-soft);color:#C62957}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.info{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.sug{background:var(--soft);color:var(--mute)}
.cicon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.cicon svg{width:19px;height:19px}
.cicon.sm{width:28px;height:28px}.cicon.sm svg{width:15px;height:15px}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex-shrink:0;transition:transform .15s,color .15s,background .15s}
.heart svg{width:22px;height:22px}
.heart.on{color:var(--blossom);background:var(--blossom-soft)}
.heart:active{transform:scale(.88)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:var(--sh3);animation:toastin .25s cubic-bezier(.3,.7,.2,1);max-width:calc(100vw - 32px);text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
@media (min-width:980px){.toast{bottom:28px}}

/* ---------- place rows ---------- */
.prow{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;width:100%;text-align:left}
.prow .tx{flex:1;min-width:0}
.prow .nm{font-weight:600;font-size:15px;line-height:1.35}
.prow .ds{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.prow.sel{background:var(--cobalt-soft)}

/* ---------- map overlay ---------- */
.mapsvg{width:100%;height:100%;touch-action:none;cursor:grab}
.mapsvg:active{cursor:grabbing}
.ov-top{position:absolute;left:0;right:0;top:0;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.ov-top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 14px;border-radius:14px;background:var(--white);box-shadow:var(--sh2);max-width:520px}
.search svg{width:19px;height:19px;color:var(--faint);flex-shrink:0}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:15px;text-overflow:ellipsis}
.search .clr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs button,.crumbs span{height:32px;padding:0 12px;border-radius:999px;background:var(--white);box-shadow:var(--sh2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.crumbs span{background:var(--ink);color:#fff}
.crumbs svg{width:14px;height:14px}
.ov-ctrl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:5;bottom:calc(var(--sheet-h,38%) + 12px);transition:bottom .32s cubic-bezier(.3,.7,.2,1)}
@media (min-width:980px){.ov-ctrl{bottom:20px;right:20px}.ov-top{padding:18px 20px 0}}
.searchres{background:var(--white);border-radius:14px;box-shadow:var(--sh2);max-width:520px;max-height:50vh;overflow-y:auto}
.searchres .prow{padding:10px 12px}
.m-label{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;white-space:nowrap;font-size:12px;font-weight:600;background:var(--white);border-radius:10px;padding:4px 9px;box-shadow:0 4px 12px -4px rgba(20,26,46,.35),0 0 0 1px rgba(20,26,46,.06);line-height:1.3;text-align:center}
.m-label small{display:block;font-size:10.5px;font-weight:500;color:var(--mute)}
.m-label.region{font-size:14px;font-family:var(--serif);font-weight:800;padding:6px 12px;border-radius:12px}
.m-label.district{background:rgba(255,255,255,.92);font-size:12.5px}
.m-label.district.on{background:var(--ink);color:#fff}
.m-label.district.on small{color:#B9C0D6}
.m-label .hrt{color:var(--blossom)}
.pin .big{transition:opacity .15s}
.pins-small .pin:not(.keep) .big{display:none}
.pins-small .pin:not(.keep) .dot{display:block}
.pin .dot{display:none}
.mlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ---------- 3D world ---------- */
.world{position:absolute;inset:0;background:linear-gradient(#DCE7FF,#EEF3FF)}
.world canvas{display:block;width:100%;height:100%;touch-action:none}
.w-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.w-label{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:999px;background:var(--white);box-shadow:0 6px 16px -6px rgba(20,26,46,.45);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform;transition:opacity .15s,background .15s}
.w-label .cicon{width:20px;height:20px}.w-label .cicon svg{width:11px;height:11px}
.w-label .hrt{color:var(--blossom);font-size:12px}
.w-label.sel{background:var(--ink);color:#fff;z-index:3}
.w-label.hide{opacity:0;pointer-events:none}
.w-hint{position:absolute;left:12px;right:68px;bottom:calc(var(--sheet-h,38%) + 14px);background:rgba(20,26,46,.8);color:#fff;font-size:12.5px;line-height:1.4;padding:9px 14px;border-radius:14px;text-align:center;pointer-events:none;transition:opacity .5s,bottom .32s}
@media (min-width:980px){.w-hint{left:50%;right:auto;transform:translateX(-50%);bottom:24px;white-space:nowrap}}
.w-load{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#EAF0FF,#F5F7FA);color:var(--mute);font-size:14px;gap:12px;text-align:center}
.w-load .spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--cobalt-soft);border-top-color:var(--cobalt);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- place detail ---------- */
.pd-head{display:flex;gap:14px;align-items:flex-start}
.pd-head .cicon{width:48px;height:48px}.pd-head .cicon svg{width:24px;height:24px}
.pd-name{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.4px}
.pd-ko{font-size:13px;color:var(--mute);margin-top:2px}
.pd-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.fact{background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
.app.t-map .fact{background:var(--soft)}
.fact small{display:block;font-size:11.5px;color:var(--faint);font-weight:500}
.fact b{display:block;font-size:13.5px;font-weight:600;line-height:1.4;margin-top:2px}
.fact.wide{grid-column:1/-1}
.pd-acts{display:flex;gap:8px;margin-top:16px}
.pd-acts .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--cobalt);margin-bottom:10px;height:32px}
.back svg{width:16px;height:16px}

/* ---------- region cards ---------- */
.rgrid{display:grid;grid-template-columns:1fr;gap:10px}
.rcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);background:var(--white);box-shadow:var(--sh1);text-align:left;width:100%}
.app.t-map .rcard{box-shadow:inset 0 0 0 1.5px var(--line)}
.rcard .rmap{width:56px;height:56px;border-radius:14px;background:var(--cobalt-soft);display:grid;place-items:center;flex-shrink:0;color:var(--cobalt)}
.rcard .rmap svg{opacity:.85}
.rcard .tx{flex:1;min-width:0}
.rcard b{font-family:var(--serif);font-size:17px;display:block}
.rcard span{font-size:12.5px;color:var(--mute);display:block;line-height:1.45}
.rcard .cnt{display:flex;gap:10px;margin-top:4px;font-size:12px;color:var(--ink2);font-weight:600}
.rcard .cnt .hrt{color:var(--blossom)}
.rcard>svg{width:18px;height:18px;color:var(--faint);flex-shrink:0}

/* ---------- 어라운드툴 연결 ---------- */
:root{--at:#0B6E5F;--at-soft:#E2F0EC}
.around{background:var(--white);border-radius:var(--r-md);box-shadow:var(--sh1);overflow:hidden}
.app.t-map .around{box-shadow:inset 0 0 0 1.5px var(--line)}
.arow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;color:inherit;text-decoration:none}
.arow+.arow{border-top:1px solid var(--soft)}
.arow .tx{flex:1;min-width:0}
.arow b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.arow small{display:block;font-size:12.5px;color:var(--mute);line-height:1.45}
.arow>svg{width:16px;height:16px;color:var(--faint);flex-shrink:0}
.achips{padding:10px 12px 12px;border-top:1px solid var(--soft)}
.achips .chip{height:32px;font-size:13px;color:var(--at);background:var(--at-soft);box-shadow:none;text-decoration:none}
.achips .chip .muted{color:var(--at);opacity:.7;font-size:12px}

/* ---------- saved ---------- */
.rg-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;background:var(--white)}
.rg-head .tx{flex:1;min-width:0}
.rg-head b{font-family:var(--serif);font-size:16px}
.rg-head small{display:block;font-size:12px;color:var(--mute)}

  const chips = gu ? gu.cats.map(c => ext(c.url, `<span lang="ko">${esc(c.cat)}</span><span class="muted">${c.count}</span>`, 'chip')).join('')
    : (!compact && gus.length > 1 ? gus.map(g => ext(g.url, `<span lang="ko">${esc(g.gu)}</span><span class="muted">${g.count}</span>`, 'chip')).join('') : '');
  return `<div class="sec"><h3>${T.atTitle}</h3><small>${koOnly()}</small></div><div class="around">${rows.join('')}${chips ? `<div class="chips achips">${chips}</div>` : ''}</div>`;
}
function aroundMore() {
  if (!AROUND) return '';
  const more = (AROUND.moreTrips || []).slice(0, 12);
  return `<div class="sec"><h3>${T.atMoreTitle}</h3><small>${koOnly()}</small></div>
    <div class="around">${ext(AROUND.travel, `<span class="cicon sm" style="background:var(--at)">${ICONS.map}</span><span class="tx"><b>${T.atAllTrips(AROUND.counts.trips)}</b><small>${T.atTripSub}</small></span>${ICONS.right}`, 'arow')}
      ${ext(AROUND.food, `<span class="cicon sm" style="background:var(--at)">${ICONS.food2}</span><span class="tx"><b>${T.atAllFood(AROUND.counts.gu, AROUND.counts.places)}</b><small>${T.atFoodSub}</small></span>${ICONS.right}`, 'arow')}
      ${more.length ? `<div class="chips achips">${more.map(m => ext(m.url, `<span lang="ko">${esc(m.name)}</span>`, 'chip')).join('')}</div>` : ''}</div>
    <p class="note">${T.atBy}</p>`;
}
function placeRow(p, opts = {}) {
  const tags = [];
  if (p.rsv) tags.push(`<span class="pill rsv">${T.needRsv}</span>`);
  if (p.best === 'night') tags.push(`<span class="pill info">${T.bestNight}</span>`); else if (p.best === 'am') tags.push(`<span class="pill info">${T.bestAm}</span>`);
  return `<div class="prow ${S.ui.sel === p.id ? 'sel' : ''}"><button class="row grow" style="text-align:left;gap:12px" data-act="place" data-v="${p.id}">${cicon(p.c)}<span class="tx"><span class="nm">${esc(pn(p.id))}</span>
    <span class="ds">${opts.sub || esc(pd(p.id))}</span>${tags.length ? `<span class="mt">${tags.join('')}</span>` : ''}</span></button>${heartBtn(p.id)}</div>`;
}
function placeInPlan(id) { if (!S.plan) return -1; return S.plan.days.findIndex(d => d.stops.some(s => s.id === id)); }
function placeDetail(id) {
  const p = PBY[id], di = placeInPlan(id);
  const facts = [
    [T.fHours, `${F.hours(p)}<br><span class="muted" style="font-weight:500">${F.closed(p)}</span>`],
    [T.fStay, T.usually(F.dur(p.h * 60))],
    [T.fPrice, p.cost ? T.perPerson(F.money(p.cost)) : T.free],
    [T.fRsv, p.rsv ? T.needRsv : T.noRsv],
    [T.fWhere, `${esc(stationOf(p))}${S.lang !== 'ko' ? `<br><span class="muted" style="font-weight:500" lang="ko">${esc(p.st)}</span>` : ''}`, true]
  ];
  if (p.season) facts.splice(1, 0, [T.fSeason, T.season(p.season[0], p.season[1]), true]);
  const best = { am: T.bestAmL, eve: T.bestEveL, night: T.bestNightL }[p.best];
  return `<button class="back" data-act="unsel">${ICONS.left}${esc(S.ui.lvl === 'district' ? dn(S.ui.d) : rn(p.r))}</button>
    <div class="pd-head">${cicon(p.c)}<div class="grow"><div class="pd-name">${esc(pn(id))}</div>${S.lang !== 'ko' ? `<div class="pd-ko" lang="ko">${esc(p.n.ko)}</div>` : ''}
      <div class="pd-ko">${esc(T.cats[p.c])} · ${esc(rn(p.r))} ${esc(dn(p.dist))}</div></div>${heartBtn(id)}</div>
    <p class="lead" style="margin-top:12px;color:var(--ink2)">${esc(pd(id))}</p>
    ${best ? `<div class="banner" style="background:var(--cobalt-soft);color:var(--cobalt2)">${ICONS.clock.replace('<svg ', '<svg width="18" height="18" ')}<span>${best}</span></div>` : ''}
    ${di >= 0 ? `<div class="banner" style="background:var(--green-soft);color:var(--green)">${ICONS.check.replace('<svg ', '<svg width="18" height="18" ')}<span>${T.inPlanDay(di + 1)}</span><button class="btn sm soft" data-act="gotoDay" data-v="${di}">${T.viewPlan}</button></div>` : ''}
    <div class="pd-facts">${facts.map(([k, v, w]) => `<div class="fact ${w ? 'wide' : ''}"><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    <div class="pd-acts"><button class="btn ${isSaved(id) ? 'ghost' : ''}" data-save="${id}">${isSaved(id) ? ICONS.heartF : ICONS.heart}${isSaved(id) ? T.savedBtn : T.saveBtn}</button>
      ${S.plan && di < 0 && S.plan.days.some(d => d.r === p.r) ? `<button class="btn ghost" data-act="addToPlan" data-v="${id}">${ICONS.plus}${T.addToPlan}</button>` : ''}
      <button class="btn ghost" data-act="taxi" data-v="${id}" style="flex:0 0 auto">${ICONS.taxi}<span class="vh">${T.taxiCard}</span></button></div>
    ${aroundCard(p.r, p.dist, true)}`;
}
function stationOf(p) { return /역/.test(p.st) ? stationTr(p.st) : `${rn(p.r)} ${dn(p.dist)}`; }
const ST_NAMES = { '경복궁': ['景福宫', 'Gyeongbokgung', '景福宮'], '안국': ['安国', 'Anguk', '安国'], '이촌': ['二村', 'Ichon', '二村'], '종로5가': ['钟路5街', 'Jongno 5-ga', '鍾路5街'], '을지로3가': ['乙支路3街', 'Euljiro 3-ga', '乙支路3街'],
  '신사': ['新沙', 'Sinsa', '新沙'], '명동': ['明洞', 'Myeong-dong', '明洞'], '홍대입구': ['弘大入口', 'Hongik Univ.', '弘大入口'], '서울숲': ['首尔林', 'Seoul Forest', 'ソウルの森'], '압구정로데오': ['狎鸥亭罗德奥', 'Apgujeong Rodeo', '狎鴎亭ロデオ'],
  '신논현': ['新论岘', 'Sinnonhyeon', '新論峴'], '성수': ['圣水', 'Seongsu', '聖水'], '동대문역사문화공원': ['东大门历史文化公园', 'DDP', '東大門歴史文化公園'], '여의나루': ['汝矣渡口', 'Yeouinaru', '汝矣ナル'], '종로3가': ['钟路3街', 'Jongno 3-ga', '鍾路3街'],
  '신용산': ['新龙山', 'Sinyongsan', '新龍山'], '삼성': ['三成', 'Samseong', '三成'], '잠실': ['蚕室', 'Jamsil', '蚕室'], '광화문': ['光化门', 'Gwanghwamun', '光化門'], '고속터미널': ['高速巴士客运站', 'Express Bus Terminal', '高速ターミナル'],
  '해운대': ['海云台', 'Haeundae', '海雲台'], '토성': ['土城', 'Toseong', '土城'], '자갈치': ['札嘎其', 'Jagalchi', 'チャガルチ'], '광안': ['广安', 'Gwangan', '広安'], '서면': ['西面', 'Seomyeon', '西面'], '오시리아': ['奥西利亚', 'OSIRIA', 'オシリア'],
  '센텀시티': ['Centum City', 'Centum City', 'センタムシティ'], '시청': ['市厅', 'City Hall', '市庁'], '회현': ['会贤', 'Hoehyeon', '会賢'], '혜화': ['惠化', 'Hyehwa', '恵化'], '망원': ['望远', 'Mangwon', '望遠'], '노량진': ['鹭梁津', 'Noryangjin', '鷺梁津'] };
function stationTr(st) { const m = /^(.+?)역(?: (\S+)번 출구)?$/.exec(st); if (!m || S.lang === 'ko') return st; const nm = ST_NAMES[m[1]] ? ST_NAMES[m[1]][LANG_IDX[S.lang] - 1] : m[1]; return T.station(nm, m[2]); }

/* ---------- modals ---------- */
function openModal(html, onMount) {
  closeModal(); const sc = document.createElement('div'); sc.className = 'scrim'; sc.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="grab2"></div>${html}</div>`;
  sc.addEventListener('click', e => { if (e.target === sc) closeModal(); }); document.body.appendChild(sc);
  $$('[data-close]', sc).forEach(b => b.onclick = closeModal);
  if (onMount) onMount(sc.querySelector('.modal')); return sc;
}
function closeModal() { $$('.scrim').forEach(s => s.remove()); }
function openMenu(anchor, items) {
  $$('.menu').forEach(m => m.remove()); const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, k) => it === '-' ? '<hr>' : `<button role="menuitem" data-k="${k}" class="${it.danger ? 'danger' : ''}" ${it.disabled ? 'disabled style="opacity:.35"' : ''}>${ICONS[it.icon] || ''}<span>${it.label}</span></button>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clamp(r.right - mw, 8, window.innerWidth - mw - 8) + 'px'; m.style.top = (r.bottom + mh + 8 > window.innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
  $$('[data-k]', m).forEach(b => b.onclick = e => { e.stopPropagation(); m.remove(); const it = items[+b.dataset.k]; it.fn && it.fn(); });
  setTimeout(() => document.addEventListener('click', function h(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('click', h); } }), 0);
}
function openTaxi(id) {
  const p = PBY[id];
  openModal(`<h3>${T.taxiCard}</h3><p class="lead">${T.taxiLead}</p>
    <div class="taxi"><div class="ko" lang="ko">${esc(p.n.ko)}</div><div class="ad" lang="ko">${esc(p.st)}</div>${S.lang !== 'ko' ? `<small>${esc(pn(id))} · ${esc(stationOf(p))}</small>` : ''}</div>
    <div class="taxi" style="background:var(--cobalt-soft)"><div class="ad" lang="ko">${esc(`${p.n.ko}${koRo(p.n.ko)} 가 주세요.`)}</div><small>${T.taxiSay}</small></div>
    <button class="btn block ink" style="margin-top:16px" data-close>${T.close}</button>`);
}

/* ---------- trip settings ---------- */
function openTrip() {
  const t = JSON.parse(JSON.stringify(S.trip));
  const draw = m => {
    const ds = []; for (let d = t.start, k = 0; d <= t.end && k < 14; d = addDays(d, 1), k++) ds.push(d); const n = ds.length;
    const hrs = Array.from({ length: 19 }, (_, k) => 6 + k);
    const apOpts = (v) => Object.keys(AIRPORTS).map(c => `<option value="${c}" ${c === v ? 'selected' : ''}>${esc(an(c))}</option>`).join('');
    const hOpts = v => hrs.map(h => `<option value="${h}" ${h === v ? 'selected' : ''}>${hm(h)}</option>`).join('');
    m.innerHTML = `<div class="grab2"></div><h3>${T.tripTitle}</h3><p class="lead">${T.tripLead}</p>
      <div class="fld"><div class="lb">${T.dates}<small>${n > 0 ? F.nights(n) : ''}</small></div>
        <div class="dates"><label class="dbox"><small>${T.first}</small><b>${T.mdShort(toDate(t.start))}</b><span>${T.wdL[toDate(t.start).getDay()]}</span><input type="date" id="t-s" value="${t.start}"></label>
        <label class="dbox"><small>${T.last}</small><b>${T.mdShort(toDate(t.end))}</b><span>${T.wdL[toDate(t.end).getDay()]}</span><input type="date" id="t-e" value="${t.end}" min="${t.start}"></label></div>
        ${n >= 14 ? `<p class="note">${T.max14}</p>` : ''}</div>
      <div class="fld"><div class="lb">${T.flights}<small>${T.flightsSub}</small></div>
        <div class="ftrow"><div class="sel"><small>${T.arrAp}</small><select id="t-aa">${apOpts(t.arr)}</select></div><div class="sel"><small>${T.arrT}</small><select id="t-at">${hOpts(t.arrT)}</select></div>
        <div class="sel"><small>${T.depAp}</small><select id="t-da">${apOpts(t.dep)}</select></div><div class="sel"><small>${T.depT}</small><select id="t-dt">${hOpts(t.depT)}</select></div></div></div>
      <div class="fld"><div class="lb">${T.who}</div><div class="ftrow"><div class="stepper"><button data-p="-1" aria-label="−">−</button><b>${T.ppl(t.people)}</b><button data-p="1" aria-label="+">+</button></div>
        <div class="segc" style="align-self:center;justify-content:space-between">${T.parties.map((p, i) => `<button class="${t.party === i ? 'on' : ''}" data-party="${i}">${p}</button>`).join('')}</div></div></div>
      <div class="fld"><div class="lb">${T.budget}<small>${T.budgetSub}</small></div><div class="tiles">${T.budgets.map((b, i) => `<button class="tile ${t.budget === i ? 'on' : ''}" data-b="${i}"><small>${b[0]}</small><b>${b[1]}</b></button>`).join('')}</div></div>
      <div class="fld"><div class="lb">${T.pace}</div><div class="tiles">${T.paces.map((b, i) => `<button class="tile ${t.pace === i ? 'on' : ''}" data-pace="${i}"><small>${b[1]}</small><b>${b[0]}</b></button>`).join('')}</div></div>
      <div class="fld"><div class="lb">${T.interests}<small>${T.multi}</small></div><div class="chips">${CAT_ORDER.map(c => `<button class="chip ${t.interests.includes(c) ? 'on' : ''}" data-int="${c}"><span class="ci" style="background:${CATS[c].col}">${catIcon(c)}</span>${T.cats[c]}</button>`).join('')}</div></div>
      <div class="fld"><label for="t-n">${T.name}<small>${T.nameSub}</small></label><input class="txtin" id="t-n" maxlength="20" value="${esc(t.name)}" placeholder="${esc(T.guest)}"></div>
      <div style="display:flex;gap:10px;margin-top:22px"><button class="btn ghost" data-close style="flex:.6">${T.cancel}</button><button class="btn" id="t-ok" style="flex:1">${T.saveTrip}</button></div>`;
    const re = () => { const y = m.scrollTop; draw(m); m.scrollTop = y; };
    $('#t-s', m).onchange = e => { t.start = e.target.value || t.start; if (t.end < t.start) t.end = t.start; if (addDays(t.start, 13) < t.end) t.end = addDays(t.start, 13); re(); };
    $('#t-e', m).onchange = e => { t.end = e.target.value || t.end; if (t.end < t.start) t.end = t.start; if (addDays(t.start, 13) < t.end) t.end = addDays(t.start, 13); re(); };
    $$('.dbox', m).forEach(b => b.onclick = e => { const i = b.querySelector('input'); if (e.target !== i) { try { i.showPicker(); } catch (er) { i.focus(); } } });
    $('#t-aa', m).onchange = e => t.arr = e.target.value; $('#t-da', m).onchange = e => t.dep = e.target.value;
    $('#t-at', m).onchange = e => t.arrT = +e.target.value; $('#t-dt', m).onchange = e => t.depT = +e.target.value;
    $$('[data-p]', m).forEach(b => b.onclick = () => { t.people = clamp(t.people + +b.dataset.p, 1, 8); re(); });
    $$('[data-party]', m).forEach(b => b.onclick = () => { t.party = +b.dataset.party; re(); });
    $$('[data-b]', m).forEach(b => b.onclick = () => { t.budget = +b.dataset.b; re(); });
    $$('[data-pace]', m).forEach(b => b.onclick = () => { t.pace = +b.dataset.pace; re(); });
    $$('[data-int]', m).forEach(b => b.onclick = () => { const c = b.dataset.int, i = t.interests.indexOf(c); i < 0 ? t.interests.push(c) : t.interests.splice(i, 1); re(); });
    $('#t-n', m).oninput = e => t.name = e.target.value;
    $$('[data-close]', m).forEach(b => b.onclick = closeModal);
    $('#t-ok', m).onclick = () => { S.trip = t; persist(); closeModal(); toast(T.tripSaved); renderAll(true); if (S.ui.tab === 'plan' || isDesk()) renderStage(); };
  };
  openModal('', m => draw(m));
}

/* ---------- intro ---------- */
function showIntro() {
  const el = document.createElement('div'); el.className = 'intro';
  const draw = () => {
    el.innerHTML = `<div class="intro-in"><div class="langs">${LANGS.map(([k, n]) => `<button class="${k === S.lang ? 'on' : ''}" data-l="${k}" lang="${HTML_LANG[k]}">${n}</button>`).join('')}</div>

      <div class="intro-map" aria-hidden="true"><svg viewBox="0 0 400 180"><path d="M128 14 V90 L286 14 M128 90 L292 166 M128 90 V166" class="pth"/>
        ${[[128, 14, .35, 112, 19, 'end'], [128, 90, .9, 112, 95, 'end'], [286, 14, 1.5, 302, 19, 'start'], [292, 166, 2.2, 308, 171, 'start']].map(([x, y, d, lx, ly, an], k) => `<g class="st" style="animation-delay:${d}s"><circle cx="${x}" cy="${y}" r="9" fill="#2443E8" stroke="#fff" stroke-width="5"/><text x="${lx}" y="${ly}" fill="#fff" font-size="14" font-weight="700" text-anchor="${an}">${esc(T.introStops[k])}</text></g>`).join('')}</svg></div>

/* ---------- actions ---------- */
const ACT = {
  region: v => openRegion(v), korea: () => openKorea(), district: v => openDistrict(v),
  filter: v => { S.ui.filter = v; persist(); renderPanel(); if (!World3D.cur) Map2D.refresh({ filter: v }); },
  place: v => selectPlace(v), unsel: () => clearSel(),
  taxi: v => openTaxi(v),
  gotoDay: v => { S.ui.day = +v; go('plan'); },
  addToPlan: (v, el) => { const p = PBY[v]; const days = S.plan.days.map((d, i) => ({ d, i })).filter(x => x.d.r === p.r);
    openMenu(el, days.map(({ d, i }) => ({ icon: 'cal', label: `${T.day(i + 1)} · ${F.date(d.date)}`, fn: () => { Plan.add(v, i); toast(T.addedDay(i + 1)); renderPanel(); } }))); }
};

</script>
<script>
'use strict';
/* =========================================================
   Saved, Plan, Book views
   ========================================================= */
function koRo(w) { const c = w.charCodeAt(w.length - 1) - 0xAC00; if (c < 0 || c > 11171) return '로'; const j = c % 28; return (j === 0 || j === 8) ? '로' : '으로'; }
const emptyArt = (ic) => `<div class="art"><svg viewBox="0 0 120 90"><rect x="8" y="14" width="104" height="66" rx="16" fill="#E9EDFF"/><circle cx="60" cy="47" r="22" fill="#fff"/><g transform="translate(46,33)" color="#2443E8">${ICONS[ic].replace('<svg ', '<svg width="28" height="28" ')}</g></svg></div>`;

/* ---------- Saved ---------- */
function needDays() {
  const per = PACE[S.trip.pace].cap;
  const mins = S.saved.map(id => PBY[id]).filter(p => !isFood(p)).reduce((a, p) => a + loadOf(p), 0);
  return { mins, days: mins / per };
}
function panelSaved() {
  if (!S.saved.length) return `<h1 class="h1">${T.savedTitle}</h1><div class="empty" style="margin-top:20px">${emptyArt('heart')}<b>${T.savedEmptyH}</b>${T.savedEmpty}<div style="margin-top:16px"><button class="btn" data-act="toMap">${ICONS.map}${T.exploreMap}</button></div></div>`;
  const order = tripOrder(), nd = needDays(), n = tripDates().length, ratio = clamp(nd.days / n, 0, 1.4);
  const sig = S.plan && S.plan.sig === planSig();
  return `<h1 class="h1">${T.savedTitle} <span class="muted" style="font-family:var(--sans);font-weight:600">${S.saved.length}</span></h1><p class="lead">${T.savedLead}</p>
    <div class="need"><div class="grow"><b>${T.needDays(Math.max(1, Math.ceil(nd.days * 10) / 10))}</b><small>${T.tripDays(n)} · ${T.paces[S.trip.pace][0]}</small>
      <div class="bar" style="margin-top:8px"><i class="${nd.days > n ? 'over' : ''}" style="width:${Math.min(100, ratio / 1.4 * 100)}%"></i></div></div></div>
    ${nd.days > n ? `<p class="note" style="color:var(--amber)">${T.tooMany}</p>` : ''}
    <div class="sec"><h3>${T.regionOrder}</h3><small>${S.orderManual ? T.orderManual : T.orderAuto}</small></div>
    ${order.map((r, k) => { const ids = S.saved.filter(id => PBY[id].r === r); const hrs = ids.map(id => PBY[id]).filter(p => !isFood(p)).reduce((a, p) => a + p.h, 0);
      return `<div class="list" style="margin-bottom:12px"><div class="rg-head"><span class="cicon" style="background:var(--ink);font-family:var(--serif);font-weight:800;font-size:14px">${k + 1}</span>
        <div class="tx"><b>${esc(rn(r))}</b><small>${T.spots(ids.length)} · ${T.aboutH(Math.round(hrs * 10) / 10)}</small></div>
        <div class="ord"><button data-act="ordUp" data-v="${r}" ${k === 0 ? 'disabled' : ''} aria-label="${T.up}">${ICONS.up}</button><button data-act="ordDown" data-v="${r}" ${k === order.length - 1 ? 'disabled' : ''} aria-label="${T.down}">${ICONS.down}</button></div></div>
        ${ids.map(id => { const p = PBY[id]; return placeRow(p, { sub: `${esc(dn(p.dist))} · ${T.usually(F.dur(p.h * 60))} · ${F.hours(p)}` }); }).join('')}</div>`; }).join('')}
    ${S.orderManual ? `<button class="btn sm ghost" data-act="ordAuto">${ICONS.magic}${T.orderReset}</button>` : ''}
    <div class="stickycta"><button class="btn block" data-act="genPlan">${ICONS.magic}${S.plan ? (sig ? T.viewPlan : T.replan) : T.makePlan(S.saved.length)}</button></div>`;

    const cands = [...S.plan.unsched.map(u => u.id).filter(id => PBY[id] && PBY[id].r === r), ...S.saved.filter(id => PBY[id].r === r && !inPlan.has(id))];
    const uniq = [...new Set(cands)];
    openModal(`<h3>${T.addStopT(i + 1)}</h3><p class="lead">${T.addStopLead}</p><div class="list" style="margin-top:14px">${uniq.length ? uniq.map(id => `<button class="prow" data-add="${id}">${cicon(PBY[id].c)}<span class="tx"><span class="nm">${esc(pn(id))}</span><span class="ds">${esc(dn(PBY[id].dist))} · ${F.dur(PBY[id].h * 60)}</span></span>${ICONS.plus.replace('<svg ', '<svg width="20" height="20" ')}</button>`).join('') : `<div class="empty">${T.addStopNone}</div>`}</div>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" data-close>${T.close}</button><button class="btn" style="flex:1" id="addmap">${ICONS.map}${T.findMore}</button></div>`,
      m => { $$('[data-add]', m).forEach(b => b.onclick = () => { Plan.add(b.dataset.add, i); closeModal(); toast(T.addedDay(i + 1)); renderPanel(); if (isDesk()) renderStage(); }); $('#addmap', m).onclick = () => { closeModal(); go('map'); openRegion(r); }; }); },
  placeUns: (v, el) => { const p = PBY[v]; openMenu(el, S.plan.days.map((d, k) => ({ d, k })).filter(x => x.d.r === p.r).map(x => ({ icon: 'cal', label: `${T.day(x.k + 1)} · ${F.date(x.d.date)}`, fn: () => { Plan.add(v, x.k); toast(T.addedDay(x.k + 1)); S.ui.day = x.k; renderPanel(); if (isDesk()) renderStage(); } }))); },
  stayAuto: v => { delete S.stayOv[v]; regenerate(true); },
  tglRsv: v => { S.book.rsv[v] = S.book.rsv[v] === false; persist(); renderPanel(); },
  tglStay: v => { S.book.stay[v] = S.book.stay[v] === false; persist(); renderPanel(); },
  guide: v => { const [i, k] = v.split(':'); if (k === 'none') delete S.book.guide[i]; else S.book.guide[i] = k; persist(); renderPanel(); },
  pay: () => { const t = bookTotal(); if (!t.sum) { S.paid = true; persist(); renderPanel(); return; }
    openModal(`<h3>${T.payT}</h3><p class="lead">${T.demoNote}</p><div class="list" style="margin-top:14px">${bookItems().rsv.filter(x => S.book.rsv[x.key] !== false && x.price).map(x => `<div class="bitem"><span class="tx"><span class="nm">${esc(pn(x.p.id))}</span><span class="sub">${T.bKind[x.kind]}</span></span><span class="pr">${F.full(x.price)}</span></div>`).join('')}
      ${Object.entries(S.book.guide).filter(([, g]) => GUIDE[g]).map(([i, g]) => `<div class="bitem"><span class="tx"><span class="nm">${T.day(+i + 1)} · ${T.gOpt[g]}</span><span class="sub">${T.bGuide}</span></span><span class="pr">${F.full(GUIDE[g])}</span></div>`).join('')}</div>
      <div class="tot" style="grid-template-columns:1fr"><div><small>${T.total}</small><b>${F.full(t.sum)} · ≈ ¥${Math.round(t.sum / 195).toLocaleString()}</b></div></div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" style="flex:.7" data-close>${T.cancel}</button><button class="btn wechat" style="flex:1" id="payok">${T.payNow}</button></div>`,
      m => { $('#payok', m).onclick = () => { S.paid = true; persist(); closeModal(); renderPanel(); toast(T.paidToast); }; }); },
  unpay: () => { S.paid = false; persist(); renderPanel(); },
  copyTxt: async () => { const txt = itineraryText(); try { await navigator.clipboard.writeText(txt); toast(T.copied); } catch (e) {
      openModal(`<h3>${T.copyTxt}</h3><textarea class="txtin" style="height:300px;margin-top:12px" readonly>${esc(txt)}</textarea><button class="btn block ink" style="margin-top:12px" data-close>${T.close}</button>`); } },
  chatSend: () => chatSend()
});
const _renderPanel0 = renderPanel;
renderPanel = function () { _renderPanel0(); if (S.ui.tab === 'plan') afterPlanRender(); if (S.ui.tab === 'book' && S.paid) { const q = $('#chatq'); if (q) q.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) chatSend(); }; } };

</script>
<script>
'use strict';
function safeStage() { try { renderStage(); } catch (e) { console.error(e); const s = document.getElementById('mapbox'); if (s && !window.d3) s.innerHTML = `<div class="empty" style="padding-top:30vh">${esc(T.noMap || 'Map unavailable')}</div>`; } }
function init() {
  let l = S.lang;
  if (!l || !I18N[l]) { const n = (navigator.language || 'en').toLowerCase(); l = n.startsWith('zh') ? 'zh' : n.startsWith('ja') ? 'ja' : n.startsWith('ko') ? 'ko' : 'en'; }
  const h = (location.hash || '').slice(1);
  if (REGIONS[h]) { S.seenIntro = true; S.ui.lvl = 'region'; S.ui.r = h; }
  setLang(l); buildShell();
  loadAround(() => { if (S.ui.tab === 'map' || S.ui.tab === 'plan') renderPanel(); });
  renderChrome(); renderPanel(); safeStage();
  if (!S.seenIntro) showIntro();
}
const _renderAll0 = renderAll;
renderAll = function (keep) { renderChrome(); renderPanel(); safeStage(); };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
